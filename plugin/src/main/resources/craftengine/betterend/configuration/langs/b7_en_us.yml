# B7-metals client-side localisation. Names are VERBATIM from the mod's
# assets/betterend/lang/en_us.json -- not prettified (note 'Aeternium Smith Hammer',
# and that all eight smithing templates really are just called 'Smithing Template').
#
# Section names carry the batch suffix so no two batch lang files collide: only the text
# BEFORE '#' selects the parser (AbstractPackManager.java:674-683), and LangParser.parseSection
# (TranslationManagerImpl.java:524-532) accumulates via addTranslations rather than replacing.
# 'block_name:betterend:<id>' is rewritten to block.betterend.<id> by ClientLangData.

