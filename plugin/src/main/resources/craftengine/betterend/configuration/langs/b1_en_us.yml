# B1 (wood families) client-side localisation.
# Section names are suffixed with the batch so no two batch files collide: AbstractPackManager
# .java:674-683 selects the parser from the text BEFORE '#', so every `lang#...` section reaches
# TranslationManagerImpl.LangParser (:485-533) and parseSection (:524-532) accumulates into
# clientLangData rather than replacing it (:351-368).
# `block_name:` is rewritten to block.betterend.<id> by ClientLangData.
# Names are verbatim from the mod's assets/betterend/lang/en_us.json. Do not prettify.

