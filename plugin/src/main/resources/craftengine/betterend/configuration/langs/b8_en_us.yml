# BetterEnd B8-storage -- client-side display names, verbatim from the mod's
# assets/betterend/lang/en_us.json. Nothing here is prettified.
#
# Two sections, both suffixed with the batch id so no two batch lang files collide.
# They still merge: AbstractPackManager.java:674-683 selects the parser from the text BEFORE
# '#', so every `lang#...` section reaches TranslationManagerImpl.LangParser (:485-533), whose
# parseSection (:524-532) calls addClientTranslation -> clientLangData.computeIfAbsent(lang)
# .addTranslations(map) (:351-368) -- accumulative, never replacing.
#
# `block_name:betterend:<id>` is rewritten to block.betterend.<id> by ClientLangData.

