# BetterEnd client-side localisation.
# `lang#...` sections are baked into the generated resource pack as assets/minecraft/lang/en_us.json
# (TranslationManagerImpl.java:485-533). Keys under `lang#items` are referenced from every item as
# data.item_name: '<!i><white><lang:item.betterend.<id>></white>'.
# The `block_name:` prefix under `lang#blocks` is rewritten to block.betterend.<id> by
# ClientLangData.java:14-59 -- byte-identical to the original mod's key.
# Names are verbatim from the mod's assets/betterend/lang/en_us.json. Do not prettify.

