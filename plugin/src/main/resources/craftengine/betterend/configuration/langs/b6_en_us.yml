# B6 -- lantern display names, verbatim from the mod
# (Reference/BetterEnd/src/main/resources/assets/betterend/lang/en_us.json). Do not prettify.
# Two sections, both suffixed b6 so they cannot collide with another batch: AbstractPackManager
# .java:674-683 selects the parser from the text BEFORE '#', and TranslationManagerImpl
# .addClientTranslation (:351-368) accumulates into the same lang map instead of replacing it.
# `block_name:betterend:<id>` is rewritten to block.betterend.<id> by ClientLangData.java:14-59.

