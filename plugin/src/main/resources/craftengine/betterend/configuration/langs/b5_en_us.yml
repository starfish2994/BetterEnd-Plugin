# BetterEnd -- batch B5 "flora-b" localisation.
# Section names carry the batch suffix so no two batch lang files collide: AbstractPackManager.java
# :674-683 selects the parser from the text BEFORE '#', and TranslationManagerImpl.java:351-368
# accumulates into clientLangData instead of replacing it, so every `lang#...` section merges.
# `block_name:betterend:<id>` is rewritten to block.betterend.<id> by ClientLangData.
# Strings are VERBATIM from the mod's assets/betterend/lang/en_us.json -- not prettified.
# ("Sulfur Crystal" and "Cave Moss Endstone Stalactite" are the mod's own spellings; kept.)
# Block items reuse their block's display name, exactly as the live Phase-2 en_us.yml does.

