# BetterEnd -- batch B4 (flora-a) localisation.
# Two batch-suffixed sections so no other batch's lang file collides; every `lang#...` section is
# merged, not replaced (AbstractPackManager.java:674-683 -> TranslationManagerImpl.java:485-533,
# addClientTranslation accumulates at :351-368).
# `block_name:betterend:<id>` is rewritten to block.betterend.<id> by ClientLangData.
# Names are verbatim from the mod's assets/betterend/lang/en_us.json.

