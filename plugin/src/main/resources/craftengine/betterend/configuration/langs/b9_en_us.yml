# BetterEnd B9 -- advancement titles and descriptions.
#
# These are client-side translation keys, not server strings. The plugin builds its
# UltimateAdvancementAPI tab with TranslatableComponent(<key>), so every player's own client
# resolves the text from the resource pack -- add a `zh_cn:` block below and Chinese clients get
# Chinese with no server change.
#
# The key shape is the mod's own: advancements.betterend.<id>.title / .description. Strings are
# verbatim from assets/betterend/lang/en_us.json. Do not prettify.
#
# Every one of the mod's 29 advancements is here, including the ones the port currently gates off
# (they need the eternal portal, the end village, the infusion ritual, the leveled anvil or the
# End Stone Smelter). Shipping their text now means unlocking a subsystem later needs no lang work.
#
# Section names are suffixed with the batch so no two batch files collide: AbstractPackManager
# .java:674-683 selects the parser from the text BEFORE '#', so this reaches
# TranslationManagerImpl.LangParser and parseSection accumulates into clientLangData rather than
# replacing it.

lang#b9_advancements:
  en_us:
    # The two every player earns
    advancements.betterend.root.title: "BetterEnd"
    advancements.betterend.root.description: "Enter a world that has a better End"
    advancements.betterend.enter_end.title: "Face the Void"
    advancements.betterend.enter_end.description: "Discover the BetterEnd"

    # Eternal portal -- gated off until the structure is ported
    advancements.betterend.portal.title: "On Eternal Paths"
    advancements.betterend.portal.description: "Discover a portal lost for eternity"
    advancements.betterend.portal_on.title: "Eternal Light"
    advancements.betterend.portal_on.description: "Light an eternal Portal"
    advancements.betterend.portal_travel.title: "Eternal Ways"
