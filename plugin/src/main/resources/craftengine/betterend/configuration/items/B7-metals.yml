# B7-metals -- the 79 metal ITEMS (ingots, nuggets, tool/armour parts, tools, armour,
# smithing templates and the two elytras). The 12 metal BLOCKS are in configuration/blocks/B7-metals.yml.
#
# TIERS, verbatim from the mod:
#   EndToolMaterial.java:5-30   thallasium  320 dur / 7.0 speed  / +1.5 dmg / ench 9  / incorrect_for_iron_tool
#                               terminite  1230 dur / 8.5 speed  / +3.5 dmg / ench 9  / incorrect_for_diamond_tool
#                               aeternium  2196 dur / 10.0 speed / +4.5 dmg / ench 10 / incorrect_for_aeternium_tool
#   EndToolTier.java:10-38      thallasium == IRON level, terminite == DIAMOND, aeternium == NETHERITE,
#                               each toolValuesWithOffset(<vanilla>, NO_OFFSET).
#   EndArmorMaterial.java:6-49  defense is (boots, leggings, chestplate, helmet, body):
#                               thallasium (1,4,5,2) tough 0.0  kb 0.00  durability x16
#                               terminite  (3,6,7,3) tough 1.0  kb 0.05  durability x25
#                               aeternium  (4,7,9,4) tough 3.5  kb 0.20  durability x42
#                               crystalite (3,6,8,3) tough 1.2  kb 0.10  durability x33
#                               (vanilla ArmorType multipliers: helmet 11, chestplate 16, leggings 15, boots 13)
#
# HOW THAT MAPS TO CE:
#   Every tool and armour piece rides a vanilla base item of the matching tier, so the mining tier,
#   attack damage, attack speed, enchantability and equip sound come from vanilla for free.
#   data.max_damage (ItemProcessors.java:56 MaxDamageProcessor) then sets the mod's own durability.
#   Armour additionally REPLACES minecraft:attribute_modifiers via data.attribute_modifiers
#   (ItemProcessors.java:39 AttributeModifiersProcessor -> item.attributeModifiers(results)), because
#   no vanilla armour material matches all four of the mod's tiers.
#   Custom armour textures come from the equipments section + settings.equipment.asset_id
#   (AbstractItemManager.java:273 CONFIG_SECTION_NAME = ConfigKeys.of("equipment(s)"),
#   ItemSettingsModifiers.java:134-158 EQUIPMENT), mirroring CE's own topaz_armor.yml/flame_elytra.yml.
#
# KNOWN DEBT (recorded, not faked):
#   * ENCHANTABILITY is DONE. The old note here claimed CraftEngine had no setting for it; that was
#     false. ItemProcessors.java:95-99 passes any data: key straight through as a raw component when
#     DataComponentKeys.contains it, and ENCHANTABLE is listed at DataComponentKeys.java:41. Every
#     tool and armour piece now carries minecraft:enchantable (tools 9/9/10 EndToolMaterial.java:14/
#     23/32, armour 17/26/40/30 EndArmorMaterial.java:16/28/40/52). break_power is unrelated -- it is
#     only the tier gate for CraftEngine's own blocks (BlockStateUtils.java:64).
#   * Tool mining SPEED still keeps the vanilla base's (6.0/8.0/9.0 vs the mod's 7.0/8.5/10.0).
#     minecraft:tool is writable by the same passthrough, but it REPLACES the component, so the fix
#     must also restate both mining rules -- deniesDrops(incorrect_for_<tier>_tool) and
#     minesAndDrops(mineable/<slot>, speed) per ToolMaterial.java:39 -- with a per-slot BLOCK tag the
#     instances do not currently pass, and aeternium's is the custom EndTags
#     INCORRECT_FOR_AETERNIUM_TOOL, which this pack does not ship. Left out until those two land.
#   * Tool ATTACK DAMAGE keeps the vanilla base's value; the mod's ToolMaterial attackDamageBonus
#     differs by 0.5 per tier. The seven HAMMERS are the exception and are now correct (see below).
#   * FIREPROOF: the old note here was wrong about which items need it. thallasium and terminite
#     armour were never fireproof in the mod (EquipmentSet.java:250-268 builds them with a plain
#     new Item(...); only AeterniumSet.java:87-89 adds .fireResistant()), so the pack is already
#     correct for all 16 armour pieces. The two ELYTRAS are the real gap: EndEquipmentItems.java:83,
#     :107 pass fireproof=true and neither is. One minecraft:damage_resistant key each, and the
#     version gate is moot -- this plugin already requires 1.20.5+.
#   * Repair items: the vanilla base's own repair ingredient applies (iron/diamond/netherite ingot),
#     not the mod's <metal>_forged_plate. CE's anvil_repair_item exists (ItemSettingsModifiers.java:68)
#     but the direction of its target list is not established by any shipped example, so it is left
#     out rather than guessed.
#   * crystalite_helmet's bonus is the mod's own betterend:generic.blindness_resistance attribute
#     (CrystaliteHelmet.java:12-22). A custom attribute needs a CE attributes: declaration plus a
#     damage rule to consume it; not portable as a drop-in and left out.
#   * The 7 smith hammers still ride the tier's SWORD for durability, tier and enchantability, but
#     their COMBAT NUMBERS are no longer the sword's -- see betterend:b7/hammer. What is still not
#     carried: MineableTags.HAMMER mining behaviour (no CE mechanism), the LeveledAnvil they forge on
#     (out of scope), their +0.2/+0.3 attack knockback, and membership in minecraft:swords, which
#     grants sweep and sword enchants the mod withholds.
#   * SPEARS: thallasium/terminite/aeternium _spear and _spear_tip -- 6 items and their 3
#     smithing_transform + 3 bclib:smithing recipes -- are NOT ported. ToolValues.SpearTuning is nine
#     floats (ToolTiers.java:86/105/124) with no CraftEngine analogue. Explicit skip, not an oversight;
#     79 shipped + 6 = the mod's 85.
#   * INGOT SOURCES: only thallasium is obtainable (its four furnace recipes are in
#     blocks/dust_wastelands.yml). terminite_ingot and aeternium_ingot are bclib:alloying, for which
#     CraftEngine registers no serializer and ships no smelter block, so most of this file is
#     unreachable in survival until an alloying replacement lands. See blocks/B7-metals.yml:649-655.
#   * The 8 smithing templates ride minecraft:paper, NOT a vanilla smithing template. A real
#     SmithingTemplateItem draws "Applies to: Diamond Equipment / Ingredients: Netherite Ingot" from
#     final Component fields on the item class (SmithingTemplateItem.java:29-32,:51-53, rendered by
#     appendHoverText :93-100), not from data components, so CE cannot override them -- all 8 showed
#     the netherite upgrade text. paper has no hardcoded tooltip lines, so data.lore below rebuilds
#     vanilla's exact layout with the mod's own strings. The template slot still accepts them:
#     CustomSmithingTransformRecipe.matches tests it with a plain Ingredient, and the slot's filter
#     is RecipePropertySet.SMITHING_TEMPLATE, derived from the loaded recipes (SmithingMenu.java:63,
#     :70-72) which CE rebuilds via RecipeManagerProxy.finalizeRecipeLoading.
#     LOST: the ghost-slot hints (base_slot_description / additions_slot_description) -- those are
#     drawn by SmithingTemplateItem's own slot-icon fields, unreachable from any item component.

templates:
  # Flat crafting resource / tool part: texture + name + browser category, no vanilla base
  # (CE's default-material is nether_brick, config.yml:290 -- same as the live pack's ender_shard).
  betterend:b7/part:
    category: betterend:metals
    data:
      item_name: '<!i><white><lang:item.betterend.${item_id}></white>'
    texture: betterend:item/${item_id}
  # Tool on a vanilla tier base; only the mod's durability is overridden.
  betterend:b7/tool:
    material: ${base}
    category: betterend:metals
    settings:
      tags:
        - betterend:${metal}_tools
        - minecraft:${tool_tag}
    data:
      item_name: '<!i><white><lang:item.betterend.${item_id}></white>'
      max_damage: ${durability}
      # EndToolMaterial.java:14/23/32 -- the vanilla base's value (iron 14 / diamond 10 /
      # netherite 15) is wrong for all three. Passed through raw by ItemProcessors.java:95-99
      # because DataComponentKeys.java:41 lists ENCHANTABLE.
      minecraft:enchantable:
        value: ${ench}
    texture: betterend:item/${item_id}
  # Smith hammer. Rides the tier's sword for durability and enchantability, but REPLACES the sword's
  # combat numbers with the mod's hammer values, which are far heavier and far slower.
  #   ToolTiers.java:26/45/64/83/102/121  ToolValues(attackDamage, attackSpeed, disableBlockingSeconds)
  #   HammerTraitBuilder.java:70          toolDef.tool(material, HAMMER, dmg, speed, disableSeconds)
  #   ToolMaterial.java:43                ATTACK_DAMAGE = attackDamageBaseline + material.attackDamageBonus
  #                                       ATTACK_SPEED  = attackSpeedBaseline (raw; the tooltip adds 4.0)
  # ${dmg} is therefore the SUM already computed per instance, not the raw ToolValues number.
  # ToolMaterial.java:39 gives tools Weapon(2, N) -- two durability per swing, where a sword takes one.
  betterend:b7/hammer:
    material: ${base}
    category: betterend:metals
    settings:
      tags:
        - betterend:hammers
        - minecraft:${tool_tag}
    data:
      item_name: '<!i><white><lang:item.betterend.${item_id}></white>'
      minecraft:attribute_modifiers:
        - type: minecraft:attack_damage
          id: minecraft:base_attack_damage
          slot: mainhand
          operation: add_value
          amount: ${dmg}
        - type: minecraft:attack_speed
          id: minecraft:base_attack_speed
          slot: mainhand
          operation: add_value
          amount: ${speed}
      minecraft:weapon:
        item_damage_per_attack: 2
        disable_blocking_for_seconds: ${disable}
    texture: betterend:item/${item_id}
  # Armour piece: vanilla base for slot/sound/enchantability, mod numbers for everything visible.
  betterend:b7/armor:
    material: ${base}
    category: betterend:metals
    settings:
      tags:
        - betterend:${metal}_armor
      equipment:
        asset_id: betterend:${asset}
        slot: ${slot}
    data:
      item_name: '<!i><white><lang:item.betterend.${item_id}></white>'
      max_damage: ${durability}
      attribute_modifiers:
        - type: minecraft:armor
          id: betterend:armor.${slot}
          slot: ${slot}
          operation: add_value
          amount: ${armor}
        - type: minecraft:armor_toughness
          id: betterend:armor_toughness.${slot}
          slot: ${slot}
          operation: add_value
          amount: ${toughness}
        - type: minecraft:knockback_resistance
          id: betterend:knockback_resistance.${slot}
          slot: ${slot}
          operation: add_value
          amount: ${knockback}
      # EndArmorMaterial.java:16/28/40/52 enchantmentValue.
      minecraft:enchantable:
        value: ${ench}
    texture: betterend:item/${item_id}
  # Smithing template, see the header note on the paper base. ${upgrade} is the mod's lang-key stem
  # (item.betterend.smithing_template.<upgrade>.*), which is NOT always item_id minus a suffix, so
  # every instance passes it explicitly. Line order/colours copy SmithingTemplateItem.appendHoverText.
  betterend:b7/smithing_template:
    material: paper
    category: betterend:metals
    data:
      item_name: '<!i><white><lang:item.betterend.${item_id}></white>'
      lore:
        - '<!i><gray><lang:item.minecraft.smithing_template>'
        - '<!i>'
        - '<!i><gray><lang:item.minecraft.smithing_template.applies_to>'
        - '<!i><blue> <lang:item.betterend.smithing_template.${upgrade}.applies_to>'
        - '<!i><gray><lang:item.minecraft.smithing_template.ingredients>'
        - '<!i><blue> <lang:item.betterend.smithing_template.${upgrade}.ingredients>'
    texture: betterend:item/${item_id}

