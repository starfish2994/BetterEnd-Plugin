# Armour/wing render assets. Layer names come from EquipmentLayerType.java:13-15 and the texture
# value is a plain identifier resolved under textures/entity/equipment/<layer>/
# (ComponentBasedEquipment.java:117-123 getCorrectTexturePath). Contents copied from the mod's own
# generated/assets/betterend/equipment/*.json.
equipments:
  betterend:thallasium:
    type: component
    humanoid: betterend:thallasium
    humanoid_leggings: betterend:thallasium
  betterend:terminite:
    type: component
    humanoid: betterend:terminite
    humanoid_leggings: betterend:terminite
  betterend:aeternium:
    type: component
    humanoid: betterend:aeternium
    humanoid_leggings: betterend:aeternium
  betterend:crystalite:
    type: component
    humanoid: betterend:crystalite
    humanoid_leggings: betterend:crystalite
  # elytra_armored.json also draws the aeternium humanoid layers under the wings.
  betterend:elytra_armored:
    type: component
    humanoid: betterend:aeternium
    humanoid_leggings: betterend:aeternium
    wings:
      texture: betterend:elytra_armored
      use_player_texture: true
  betterend:elytra_crystalite:
    type: component
    wings:
      texture: betterend:elytra_crystalite
      use_player_texture: true

# CrystaliteArmor.java:64-67: the full four-piece set (the elytra counts as the chest piece via
# EndTags.CRYSTALITE_SET) reapplies EndStatusEffects.CRYSTALITE_HEALTH_REGEN, which is
# MobEffects.REGENERATION amplifier 0, ambient, no particles, icon shown
# (EndStatusEffects.java:16-23). Section parsed by AbstractAttributeManager.java:396.
equipment_sets:
  betterend:crystalite:
    pieces:
      # QUOTED ON PURPOSE: snakeyaml-engine resolves a bare `4` to an Integer key, and both
      # TemplateManagerImpl.preprocessUnknownValue (:101-104) and EquipmentSet.fromConfig (:24-27)
      # iterate keySet() as String -> ClassCastException at pack load. Integer.parseInt("4") is fine.
      '4':
        potion_effects:
          - type: minecraft:regeneration
            amplifier: 0
            ambient: true
            particles: false
            show_icon: true

