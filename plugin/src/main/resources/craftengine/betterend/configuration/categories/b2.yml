# B2 declares only its own leaf category. `list: []` is deliberate: membership is pushed in from each
# item's own `category:` key via AbstractItemManager.java:429-432 addExternalCategoryMember.
categories:
  betterend:foliage:
    name: '<!i><white><l10n:category.betterend.foliage></white>'
    hidden: true
    icon: betterend:tenanea_leaves
    list: []

translations#b2_categories:
