blocks:
  # ---- ICE ------------------------------------------------------------------
  # EndDecorBlocks.java:77-95. Each variant copies a vanilla ice block's properties via
  # IceBlockTrait.withBase(ICE / PACKED_ICE / BLUE_ICE), so hardness/friction are the vanilla
  # ones. EmeraldIceBlock and AncientEmeraldIceBlock also melt on random tick -- CE has no melt
  # behavior (change_over_time_block is one-way and condition-free), so these do not melt.
  # Vanilla ice loot is "nothing without Silk Touch"; default:loot_table/silk_touch does exactly
  # that (loot_tables.yml:70-87).
  betterend:emerald_ice:
    settings:
      template:
        - default:sound/glass
        - default:settings/transparent_1x1x1
      merges:
        hardness: 0.5
        resistance: 0.5
        friction: 0.98
        instrument: hat
        map_color: ice
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/silk_touch
      arguments:
        item: betterend:emerald_ice
    state:
      auto_state: solid
      model: betterend:block/emerald_ice
  betterend:dense_emerald_ice:
    settings:
      template:
        - default:sound/glass
        - default:settings/solid_1x1x1
      merges:
        hardness: 0.5
        resistance: 0.5
        friction: 0.98
        instrument: hat
        map_color: ice
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/silk_touch
      arguments:
        item: betterend:dense_emerald_ice
    state:
      auto_state: solid
      model: betterend:block/dense_emerald_ice
  betterend:ancient_emerald_ice:
    settings:
      template:
        - default:sound/glass
        - default:settings/solid_1x1x1
      merges:
        hardness: 2.8
        resistance: 2.8
        friction: 0.989
        instrument: hat
        map_color: ice
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/silk_touch
      arguments:
        item: betterend:ancient_emerald_ice
    state:
      auto_state: solid
      model: betterend:block/ancient_emerald_ice
  # ---- DENSE SNOW -----------------------------------------------------------
  # EndDecorBlocks.java:71-75, SnowBlockTrait -- vanilla snow_block properties.
  betterend:dense_snow:
    settings:
      template:
        - default:sound/snow
        - default:settings/solid_1x1x1
      merges:
        hardness: 0.2
        resistance: 0.2
        instrument: snare
        map_color: snow
        tags: [minecraft:mineable/shovel]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/dense_snow
  # ---- END STONE BRICK VARIANTS ---------------------------------------------
  betterend:end_stone_brick_cracked:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 3.0
        resistance: 9.0
        instrument: basedrum
        map_color: sand
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/end_stone_brick_cracked
  betterend:end_stone_brick_weathered:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 3.0
        resistance: 9.0
        instrument: basedrum
        map_color: sand
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/end_stone_brick_weathered
  # ---- MENGER SPONGE --------------------------------------------------------
  # EndDecorBlocks.java:118-135 -- noOcclusion, mineable with a hoe, cutout render.
  # MengerSpongeBlock's water-absorbing behavior (the dry one soaking a pool and turning wet) has
  # no CE equivalent; the two blocks ship independent, linked only by the smelting recipe below.
  betterend:menger_sponge:
    settings:
      template:
        - default:sound/grass
        - default:settings/transparent_1x1x1
      merges:
        hardness: 0.6
        resistance: 0.6
        instrument: bass
        map_color: color_yellow
        tags: [minecraft:mineable/hoe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/menger_sponge
  betterend:menger_sponge_wet:
    settings:
      template:
        - default:sound/grass
        - default:settings/transparent_1x1x1
      merges:
        hardness: 0.6
        resistance: 0.6
        instrument: bass
        map_color: color_yellow
        tags: [minecraft:mineable/hoe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/menger_sponge_wet
  # ---- NEON CACTUS BLOCK ----------------------------------------------------
  # EndDecorBlocks.java:97-101 -- RotatedPillarBlock, lightLevel 15.
  # A property literally named `axis` gets its placement + rotation for free
  # (HardcodedPropertyBlockBehavior.java:29-42).
  betterend:neon_cactus_block:
    settings:
      template:
        - default:sound/wood
        - default:settings/solid_1x1x1
      merges:
        hardness: 0.4
        resistance: 0.4
        luminance: 15
        instrument: bass
        map_color: color_green
        tags: [minecraft:mineable/axe]
    loot:
      template: default:loot_table/self
    state:
      template: default:block_state/pillar
      arguments:
        pillar_model: betterend:block/neon_cactus_block
        pillar_texture_top: betterend:block/neon_cactus_block_top
        pillar_texture_side: betterend:block/neon_cactus_block_side
  # ---- SMARAGDANT CRYSTAL FAMILY --------------------------------------------
  # EndCrystalBlocks.java:144-154 -- lightLevel 15, strength 1, SoundType.AMETHYST, noOcclusion.
  # The four sub-blocks use replacePropertiesWithCopy(SMARAGDANT_CRYSTAL)
  # (CrystalSubblocksMaterial.java:60-80), so they share every one of those values.
  betterend:smaragdant_crystal:
    settings:
      template:
        - default:sound/amethyst_block
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        instrument: basedrum
        map_color: color_green
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      template: default:block_state/pillar
      arguments:
        pillar_model: betterend:block/smaragdant_crystal
        pillar_texture_top: betterend:block/smaragdant_crystal_top
        pillar_texture_side: betterend:block/smaragdant_crystal_side
  betterend:smaragdant_crystal_pillar:
    settings:
      template:
        - default:sound/amethyst_block
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        instrument: basedrum
        map_color: color_green
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      template: default:block_state/pillar
      arguments:
        pillar_model: betterend:block/smaragdant_crystal_pillar
        pillar_texture_top: betterend:block/smaragdant_crystal_pillar_top
        pillar_texture_side: betterend:block/smaragdant_crystal_pillar_side
  betterend:smaragdant_crystal_bricks:
    settings:
      template:
        - default:sound/amethyst_block
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        instrument: basedrum
        map_color: color_green
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/smaragdant_crystal_bricks
  betterend:smaragdant_crystal_polished:
    settings:
      template:
        - default:sound/amethyst_block
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        instrument: basedrum
        map_color: color_green
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/smaragdant_crystal_polished
  betterend:smaragdant_crystal_tiles:
    settings:
      template:
        - default:sound/amethyst_block
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        instrument: basedrum
        map_color: color_green
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/smaragdant_crystal_tiles
  # ---- SILK MOTH HIVE -------------------------------------------------------
  # EndFunctionalBlocks.java:87-95 -- strength(0.5, 0.1), SoundType.WOOL, noOcclusion, mineable
  # with an axe. The mod's FULLNESS 0-3 fills the hive with silk as the moths work it; with no
  # silk moth entity in this phase there is nothing to advance it, so only the empty appearance
  # ships (4 facings). moth_hive_front_silk.png is deliberately left uncopied.
  betterend:silk_moth_hive:
    settings:
      template:
        - default:hardness/wool
        - default:settings/transparent_1x1x1
      merges:
        hardness: 0.5
        resistance: 0.1
        instrument: guitar
        map_color: color_pink
        sounds:
          break: minecraft:block.wool.break
          fall: minecraft:block.wool.fall
          hit: minecraft:block.wool.hit
          place: minecraft:block.wool.place
          step: minecraft:block.wool.step
        tags: [minecraft:mineable/axe]
    loot:
      template: default:loot_table/self
    state:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        north:
          auto_state: solid
          model: betterend:block/silk_moth_hive
        east:
          auto_state: solid
          model:
            path: betterend:block/silk_moth_hive
            y: 90
        south:
          auto_state: solid
          model:
            path: betterend:block/silk_moth_hive
            y: 180
        west:
          auto_state: solid
          model:
            path: betterend:block/silk_moth_hive
            y: 270
      variants:
        facing=north:
          appearance: north
        facing=east:
          appearance: east
        facing=south:
          appearance: south
        facing=west:
          appearance: west
  # ---- FLAVOLITE RUNED ------------------------------------------------------
  # EndStoneBlocks.java:260-269 -- strength(1, obsidian resistance), lightLevel 8 only while
  # ACTIVATED. `active` is set by the Eternal Portal ritual, which no CE behavior reproduces, so
  # the block ships as the inactive rune mesh exactly as the live pack shipped brimstone's
  # unreachable `active` (basic_blocks.yml). flavolite_runed_active_*.png stays uncopied.
  # The mod also picks one of 5 rune meshes at random; the generated blockstate json only
  # references variant 1, so variant 1 is what ships.
  betterend:flavolite_runed:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.0
        resistance: 1200.0
        instrument: basedrum
        map_color: sand
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe, minecraft:dragon_immune]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/flavolite_runed_1

recipes:
  # Verbatim from generated/data/betterend/recipe/.
  betterend:dense_emerald_ice:
    type: shaped
    pattern:
      - '##'
      - '##'
    ingredients:
      '#': betterend:emerald_ice
    result:
      id: betterend:dense_emerald_ice
      count: 1
  betterend:ancient_emerald_ice:
    type: shaped
    pattern:
      - '###'
      - '###'
      - '###'
    ingredients:
      '#': betterend:dense_emerald_ice
    result:
      id: betterend:ancient_emerald_ice
      count: 1
  # `time` is explicit because CE defaults to 80 ticks (CustomSmeltingRecipe.java:52 /
  # CustomBlastingRecipe.java:52) while the mod's json omits cookingtime and so inherits
  # vanilla's 200 (smelting) / 100 (blasting).
  betterend:end_stone_brick_cracked_smelting:
    type: smelting
    ingredient: minecraft:end_stone_bricks
    experience: 0.1
    time: 200
    result:
      id: betterend:end_stone_brick_cracked
      count: 1
  betterend:end_stone_brick_cracked_blasting:
    type: blasting
    ingredient: minecraft:end_stone_bricks
    experience: 0.1
    time: 100
    result:
      id: betterend:end_stone_brick_cracked
      count: 1
