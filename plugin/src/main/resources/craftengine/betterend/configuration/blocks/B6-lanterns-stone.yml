# Only the 7 stone lanterns whose recipe uses a VANILLA slab can ship. The other seven
# (azure_jadestone, flavolite, sandy_jadestone, sulphuric_rock, umbralith, violecite,
# virid_jadestone) call for betterend:<family>_slab, and slabs are in the manifest SKIP set -- no
# custom slab id will ever exist, so those recipes are omitted rather than faked with a full block.
# CROSS-BATCH: betterend:crystal_shards is a B5 item.
config_factory#b6_stone_lantern_recipes:
  instances:
    - {stone: andesite,   slab: minecraft:andesite_slab}
    - {stone: blackstone, slab: minecraft:blackstone_slab}
    - {stone: diorite,    slab: minecraft:diorite_slab}
    - {stone: end_stone,  slab: minecraft:end_stone_brick_slab}
    - {stone: granite,    slab: minecraft:granite_slab}
    - {stone: purple,     slab: minecraft:purpur_slab}
    - {stone: quartz,     slab: minecraft:quartz_slab}
  blueprint:
    recipes:
      betterend:${stone}_lantern:
        type: shaped
        category: building
        group: end_stone_lanterns
        pattern:
          - 'S'
          - '#'
          - 'S'
        ingredients:
          S: ${slab}
          '#': betterend:crystal_shards
        result:
          id: betterend:${stone}_lantern
          count: 1

# ---------------------------------------------------------------------------------------------
# 4 chandeliers. ChandelierBlock extends BaseAttachedBlock, a 6-way FACING attached block, so
# `directional_attached_block` is the exact match: it requires a `facing` property whose value set
# has 6 entries (DirectionalAttachedBlockBehavior.java:42, :107) and attaches to facing.opposite()
# (:64-66). Its `blacklist` defaults to true with empty attached lists, i.e. "any sturdy face"
# (:71-79), which is what BaseAttachedBlock does -- so no extra keys.
# The four wall appearances are ONE model at four y rotations, matching the mod blockstate json;
# applyOtherBlockStateProperties (AbstractBlockManager.java:1000-1007) is what accepts `y`.
config_factory#b6_chandeliers:
  instances:
    - {metal: gold,       ingot: minecraft:gold_ingot,       hardness: 3.0, resistance: 6.0, map_color: gold,              instrument: bell, rod: lightning_rod}
    - {metal: iron,       ingot: minecraft:iron_ingot,       hardness: 5.0, resistance: 6.0, map_color: metal,             instrument: iron_xylophone, rod: exposed_lightning_rod}
    - {metal: terminite,  ingot: betterend:terminite_ingot,  hardness: 7.0, resistance: 9.0, map_color: warped_wart_block, instrument: iron_xylophone, rod: weathered_lightning_rod}
    - {metal: thallasium, ingot: betterend:thallasium_ingot, hardness: 5.0, resistance: 6.0, map_color: color_blue,        instrument: iron_xylophone, rod: oxidized_lightning_rod}
  blueprint:
    items:
      betterend:${metal}_chandelier:
        category: betterend:lights
        settings:
          tags:
            - betterend:lanterns
        data:
          item_name: '<!i><white><lang:item.betterend.${metal}_chandelier></white>'
        # generated/assets/betterend/items/<metal>_chandelier.json binds
        # betterend:item/<metal>_chandelier, an item/generated sprite -- unlike every other id in
        # this batch the chandelier item is NOT its block model.
        texture: betterend:item/${metal}_chandelier
        behavior:
          type: block_item
          block: betterend:${metal}_chandelier
    blocks:
      betterend:${metal}_chandelier:
        # Chandelier.java:40-46: RENDER_LAYER.cutout, lightLevel 15, noCollission, noOcclusion,
        # requiresCorrectToolForDrops, LOOT_TABLE.dropSelf. CE has no no-collision setting -- the
        # note_block host keeps its full cube hitbox. DEBT, cosmetic only.
        # hardness/resistance: terminite 7/9 (EndMetalBlocks.java:85-95), the rest 5/6
        # (MetalMaterial.java:186 .strength(5.0F, 6.0F)); gold takes vanilla gold_block 3/6.
        settings:
          template:
            - default:sound/metal
            - default:settings/transparent_1x1x1
          merges:
            hardness: ${hardness}
            resistance: ${resistance}
            luminance: 15
            push_reaction: destroy
            # gold copies Blocks.GOLD_BLOCK (BELL); the other three are IRON_XYLOPHONE
            # (MetalMaterial.java:186 / Blocks.IRON_BLOCK via VanillaMetalSet.java:39-41).
            instrument: ${instrument}
            map_color: ${map_color}
            require_correct_tools: true
            correct_tools: ['#minecraft:pickaxes']
            required_break_power: 1
            tags: [minecraft:mineable/pickaxe]
        loot:
          template: default:loot_table/self
        behavior:
          type: directional_attached_block
        state:
          properties:
            facing:
              type: 6-direction
              default: up
          appearances:
            up:
              state: ${rod}[facing=up,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_floor
            down:
              state: ${rod}[facing=down,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_ceil
            south:
              state: ${rod}[facing=south,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_wall
            west:
              state: ${rod}[facing=west,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 90
            north:
              state: ${rod}[facing=north,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 180
            east:
              state: ${rod}[facing=east,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 270
          variants:
            facing=up:
              appearance: up
            facing=down:
              appearance: down
            facing=north:
              appearance: north
            facing=south:
              appearance: south
            facing=west:
              appearance: west
            facing=east:
              appearance: east
    recipes:
      # generated/data/betterend/recipe/<metal>_chandelier.json.
      # CROSS-BATCH: betterend:lumecorn_rod is a B5 item; terminite/thallasium ingots are B7.
      betterend:${metal}_chandelier:
        type: shaped
        category: building
        group: end_metal_chandelier
        pattern:
          - 'I#I'
          - ' # '
        ingredients:
          I: betterend:lumecorn_rod
          '#': ${ingot}
        result:
          id: betterend:${metal}_chandelier
          count: 1

# ---------------------------------------------------------------------------------------------
# 4 plant-derived light blocks. All four are genuine full cubes -- their blockstate json has the
# single variant "" and their model is a plain cube -- so one appearance each. amaranita_lantern,
# blue_vine_lantern and glowing_pillar_luminophor use the mod own betterend:block/cube_noshade
# (shade:false on every face, so the glow reads flat); filalux_lantern uses minecraft:block/cube_all.
# Both parents are staged, so the models are referenced rather than regenerated from `texture:`.
items:
  betterend:amaranita_lantern:
    category: betterend:lights
    settings:
      tags:
        - betterend:lanterns
    data:
      item_name: '<!i><white><lang:item.betterend.amaranita_lantern></white>'
    model: betterend:block/amaranita_lantern
    behavior:
      type: block_item
      block: betterend:amaranita_lantern
  betterend:blue_vine_lantern:
    category: betterend:lights
    settings:
      tags:
        - betterend:lanterns
    data:
      item_name: '<!i><white><lang:item.betterend.blue_vine_lantern></white>'
    model: betterend:block/blue_vine_lantern
    behavior:
      type: block_item
      block: betterend:blue_vine_lantern
  betterend:filalux_lantern:
    category: betterend:lights
    settings:
      tags:
        - betterend:lanterns
    data:
      item_name: '<!i><white><lang:item.betterend.filalux_lantern></white>'
    model: betterend:block/filalux_lantern
    behavior:
      type: block_item
      block: betterend:filalux_lantern
  betterend:glowing_pillar_luminophor:
    category: betterend:lights
    settings:
      tags:
        - betterend:lanterns
    data:
      item_name: '<!i><white><lang:item.betterend.glowing_pillar_luminophor></white>'
    model: betterend:block/glowing_pillar_luminophor
    behavior:
      type: block_item
      block: betterend:glowing_pillar_luminophor
blocks:
  # EndLightBlocks.java:76,92,108 -- BlockTraits.PLANT_LIGHT_BLOCK (the shroomlight archetype:
  # strength 1.0/1.0, hoe-mineable, light 15) + CompostableBlockTrait 0.65. The archetype itself
  # lives in wover, which is not under Reference/, so the numbers here are shroomlight own.
  # CE has no compost behavior and this batch ships no composter, so the compost chance is dropped.
  betterend:amaranita_lantern:
    settings:
      template:
        - default:sound/grass
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        map_color: wood
        tags: [minecraft:mineable/hoe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/amaranita_lantern
  betterend:blue_vine_lantern:
    settings:
      template:
        - default:sound/grass
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        map_color: wood
        tags: [minecraft:mineable/hoe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/blue_vine_lantern
  # EndLightBlocks.java:123-129 -- BlockTraits.WOOD_BLOCK, SoundType.WOOD, lightLevel 15.
  betterend:filalux_lantern:
    settings:
      template:
        - default:sound/wood
        - default:settings/solid_1x1x1
      merges:
        hardness: 2.0
        resistance: 3.0
        luminance: 15
        instrument: bass
        map_color: wood
        tags: [minecraft:mineable/axe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/filalux_lantern
  # EndLightBlocks.java:87-100 -- PLANT_LIGHT_BLOCK + MINEABLE_WITH.needsShears + mapColor
  # COLOR_ORANGE. The archetype's own minecraft:mineable/hoe is kept; needsShears has NO vanilla
  # block-tag equivalent (shears are hardcoded tool rules, not a mineable/* tag) and is dropped.
  # No correct_tools either -- the block is not requiresCorrectToolForDrops.
  betterend:glowing_pillar_luminophor:
    settings:
      template:
        - default:sound/grass
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.0
        resistance: 1.0
        luminance: 15
        map_color: color_orange
        tags: [minecraft:mineable/hoe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      model: betterend:block/glowing_pillar_luminophor
recipes:
  # generated/data/betterend/recipe/filalux_lantern.json -- 3x3 of betterend:filalux (a B5 vine).
  # amaranita_lantern, blue_vine_lantern and glowing_pillar_luminophor have NO recipe json: they
  # are worldgen-only (mushroom caps / vine tips) and stay creative-only until the terrain pass.
  betterend:filalux_lantern:
    type: shaped
    category: building
    pattern:
      - '###'
      - '###'
      - '###'
    ingredients:
      '#': betterend:filalux
    result:
      id: betterend:filalux_lantern
      count: 1
