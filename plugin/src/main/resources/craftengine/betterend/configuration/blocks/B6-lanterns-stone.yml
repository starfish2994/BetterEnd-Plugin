# B6 -- lanterns. 25 of the 73 ids of the manifest B6 batch; the 48 dyed bulb lanterns are
# UNSHIPPED, see SHAPE DONORS below.
#
# ============================ SHAPE DONORS (2026 remap) ======================================
# CraftEngine cannot override collision. BukkitBlockShape.java:20-26 forwards getShape and
# getCollisionShape straight to the donor visual state bound at BukkitBlockManager.java:312, and
# not one of the 37 keys in BlockSettingsModifiers.java is a shape or collision override. Every
# lantern and chandelier in this file used to sit on `auto_state: solid` -- note_block and the three
# mushroom blocks, a FULL SOLID CUBE. A hanging lantern therefore blocked the cell it hung in and a
# floor lantern could not be walked through. That is the single most visible shape bug in the pack.
#
# The donors below are all non-waxed copper / lightning-rod states that internal/mappings.yml
# collapses onto their waxed twins (:4072 rods, :4329 lanterns, :2117+ trapdoors). They belong to no
# AutoStateGroup (AutoStateGroup.java:12-58), so they can only be taken by an explicit `state:` --
# which means no other pack's auto-allocation can ever steal them, unlike a shared pool. Verified
# unclaimed across all 8 packs on this server.
#
#   3 undyed bulb lanterns + end_stone_lantern -> copper_lantern[hanging=..,waterlogged=false]
#       EXACT. The vanilla lantern box is the shape these blocks want, and the donor's `hanging`
#       property lines up 1:1 with our own. Only 4 dry pairs exist, hence only 4 blocks get it.
#   13 remaining stone lanterns -> <copper>_trapdoor[..,half=bottom|top,open=false,..]
#       APPROXIMATE, and recorded as such: a closed trapdoor is a 3px pad, not a lantern box. What
#       it buys is the thing players actually notice -- half=top puts the pad on the ceiling so you
#       can walk UNDER a hanging lantern, and half=bottom puts it on the floor so a standing lantern
#       no longer fills its cell. The visible model is ~12px tall over a 3px hitbox: you can clip
#       through the upper body. Strictly better than a full cube, still not right.
#   4 chandeliers -> <oxidation>_lightning_rod[facing=..,powered=false,waterlogged=false]
#       facing maps 1:1, and this is an IMPROVEMENT, NOT A MATCH -- read the next four lines before
#       quoting the boxes. The mod chandelier has NO COLLISION AT ALL: ChandelierBlock.java:39 calls
#       .noCollision() in the constructor and Chandelier.java:43 calls .noCollission() again on the
#       definition. ChandelierBlock.java:140-145's box(5,0,5,11,13,11) / (5,3,5,11,16,11) / half-cells
#       are the OUTLINE (selection) shape only; you walk straight through a chandelier in the mod.
#       CraftEngine cannot express "no collision" on a donor that has one, and every no-collision
#       donor is a shared pool that is nearly full (tripwire 122/126, kelp 23/25, sugar_cane 14/15) --
#       24 states are not there to take. So the rod is a deliberate downgrade from a full solid cube
#       (4096 px^3 of obstruction) to a 4x4 rod (256 px^3, or a 4x4 bar across the cell on the wall
#       facings). Better than what was here, still wrong. UNRESOLVED, revisit if a no-collision pool
#       ever frees 24 states. The powered=true half of each rod family backs lumecorn in B5-flora-b.yml.
#
# WHY THE 48 DYED BULB LANTERNS ARE GONE. 65 lanterns x 2 appearances = 130 states of "small
# non-occluding partial box". The entire server has 64 dry closed-trapdoor states plus 8 dry
# copper_lantern states = 72, and 16 of those are already spent on ladders/pots/lotus leaves
# elsewhere in the pack. The dyed variants are pure recolours of the three undyed lanterns, so they
# are the cheapest 48 ids to drop; the alternative was 48 blocks that break player movement.
# The FarmersDelight one-state + item_display trick does not rescue them: it only works on a donor
# that renders as nothing (tripwire), and tripwire has NO collision at all -- a lantern you walk
# straight through is not an improvement, and tripwire is the pack's tightest pool.
# =============================================================================================
#
# THE bclib BLOCKER IS FALSE. The audit reported 65/73 models parenting to
# bclib:block/{bulb,stone}_lantern_{floor,ceil} with no such file under Reference/. The mod ships
# those four geometries ITSELF, as bclib "patterns":
#   Reference/BetterEnd/src/main/resources/assets/betterend/patterns/block/bulb_lantern_ceil.json
#                                                                        /bulb_lantern_floor.json
#                                                                        /stone_lantern_ceil.json
#                                                                        /stone_lantern_floor.json
# They carry %glow% / %metal% / %block% placeholders in their `textures` map. Staging re-authors
# them as betterend:block/<same name> with the placeholders replaced by "#glow" / "#side" / "#glass"
# aliases onto the keys the generated child models already declare, and with `tintindex` stripped
# (see the tint note below). Every child model is the mod-generated json with bclib: -> betterend:.
#
# TINTS ARE BAKED, NOT LIVE.
#   * Dyed bulb lanterns. All 16 dye variants of a metal share ONE model and ONE near-greyscale
#     texture (betterend:block/bulb_vine_lantern_bulb) and differ only by a BlockColor:
#     ColoredMaterial.java:103-141 attaches TINT.constColor(boost(DyeColor.getMapColor().col)) and
#     BulbVineLanternColoredBlock.boostLanternColor (:19-24) pushes value to 1.0 when saturation
#     > 0.2. CE has no per-block tint for a solid, so staging bakes 16 recoloured PNGs
#     (bulb_vine_lantern_bulb_<dye>.png, with the animation .mcmeta copied alongside) exactly as B8
#     does for the hydralux petals. The three undyed lanterns carry no tint trait -- raw texture.
#   * Stone lanterns. The crystal face is tinted from EndCrystalBlocks.AURORA_PALETTE through a
#     PALETTE_CYCLE tinter (StoneLantern.java:50-53) -- a per-position colour cycle CE cannot
#     express at all. aurora_crystal.png is already a coloured sprite, so the tint is dropped and
#     the sprite ships as-is. DEBT: one fixed colour instead of cycling the aurora palette.
#
# STATE SHAPE. EndLanternBlock (blocks/basis/EndLanternBlock.java:37-50) is {is_floor, waterlogged}.
# `waterlogged` is dropped: it would double every appearance (158 -> 316 SOLID candidates) to
# reproduce a property the note_block host cannot honour anyway. `is_floor` is inverted into CE's
# `hanging`, which is the property name HangableBlockBehavior.Factory hard-requires
# (HangableBlockBehavior.java:87, getProperty(..., "hanging", Boolean.class)); that behavior's
# canSurvive / updateStateForPlacement (:36-62) is EndLanternBlock own placement logic verbatim.
#
# STATE COST: 4 plant lanterns x1 = 4 SOLID. Everything else in this file is an explicit state:
#   8 copper_lantern (4 blocks x2) + 26 copper trapdoor (13 blocks x2) + 24 lightning rod
#   (4 chandeliers x6) = 58 states that belong to this pack alone. Down from 158 SOLID.
#
# Settings follow the batch convention: [default:sound/lantern, default:settings/transparent_1x1x1]
# + merges. `merges:` never `overrides:` -- overrides is a shallow putAll that would drop the
# template own tags (TemplateManagerImpl.java:143 vs deepMergeMaps :385-387).
# luminance 15 everywhere: BulbLantern.java:48-52, StoneLantern.java:47, Chandelier.java:41.

# ---------------------------------------------------------------------------------------------
# 51 bulb lanterns = {iron,terminite,thallasium} x {undyed + 16 dyes}.
# Blocks and items only; the recipes live in the two recipe factories below, because the undyed
# and dyed forms take different recipe types.
config_factory#b6_bulb_lanterns:
  instances:
    - {id: iron_bulb_lantern, map_color: metal,
       floor_state: 'copper_lantern[hanging=false,waterlogged=false]', ceil_state: 'copper_lantern[hanging=true,waterlogged=false]'}
    - {id: terminite_bulb_lantern, map_color: warped_wart_block,
       floor_state: 'exposed_copper_lantern[hanging=false,waterlogged=false]', ceil_state: 'exposed_copper_lantern[hanging=true,waterlogged=false]'}
    - {id: thallasium_bulb_lantern, map_color: color_blue,
       floor_state: 'weathered_copper_lantern[hanging=false,waterlogged=false]', ceil_state: 'weathered_copper_lantern[hanging=true,waterlogged=false]'}
  blueprint:
    items:
      betterend:${id}:
        category: betterend:lights
        settings:
          tags:
            - betterend:lanterns
        data:
          item_name: '<!i><white><lang:item.betterend.${id}></white>'
        # BulbVineLanternBlock.java:96 delegateItemModel(block, floorModel) -- the item shows the
        # standing form, not the hanging one.
        model: betterend:block/${id}_floor
        behavior:
          type: block_item
          block: betterend:${id}
    blocks:
      betterend:${id}:
        # BulbLantern.java:48-52: destroyTime(1), explosionResistance(1), lightLevel 15,
        # SoundType.LANTERN, noOcclusion, MINEABLE_WITH.needsPickAxe.
        settings:
          template:
            - default:sound/lantern
            - default:settings/transparent_1x1x1
          merges:
            hardness: 1.0
            resistance: 1.0
            luminance: 15
            push_reaction: destroy
            # NoteBlockInstrument.IRON_XYLOPHONE: MetalMaterial.java:186 for terminite/thallasium,
            # and copied off Blocks.IRON_BLOCK by VanillaMetalSet.java:39-41 for iron.
            instrument: iron_xylophone
            # NOT `metal` for every id: the 3 undyed lanterns keep their family colour
            # (MetalMaterial.java:184 / the vanilla source block), but all 48 dyed variants are
            # forced to COLOR_BLACK by ColoredMaterial.java:108-110
            # (.replacePropertiesWithCopy(source).mapColor(MapColor.COLOR_BLACK)).
            map_color: ${map_color}
            correct_tools: ['#minecraft:pickaxes']
            required_break_power: 1
            tags: [minecraft:mineable/pickaxe]
        loot:
          template: default:loot_table/self
        behavior:
          type: hangable_block
        state:
          properties:
            hanging:
              type: boolean
              default: false
          appearances:
            floor:
              state: ${floor_state}
              model: betterend:block/${id}_floor
            ceil:
              state: ${ceil_state}
              model: betterend:block/${id}
          variants:
            hanging=false:
              appearance: floor
            hanging=true:
              appearance: ceil

# The three undyed bulb lanterns. generated/data/betterend/recipe/<metal>_bulb_lantern.json.
# CROSS-BATCH: betterend:glowing_bulb is a B5 item; the terminite/thallasium ingots and chains
# are B7. Land B5 and B7 before this file or these three recipes have unresolvable ingredients.
config_factory#b6_bulb_lantern_recipes:
  instances:
    - {metal: iron, chain: minecraft:iron_chain, ingot: minecraft:iron_ingot}
    - {metal: terminite, chain: betterend:terminite_chain, ingot: betterend:terminite_ingot}
    - {metal: thallasium, chain: betterend:thallasium_chain, ingot: betterend:thallasium_ingot}
  blueprint:
    recipes:
      betterend:${metal}_bulb_lantern:
        type: shaped
        category: building
        pattern:
          - 'C'
          - 'I'
          - '#'
        ingredients:
          C: ${chain}
          I: ${ingot}
          '#': betterend:glowing_bulb
        result:
          id: betterend:${metal}_bulb_lantern
          count: 1

# UNSHIPPED (2026 remap): the 48 dyed bulb lanterns and their 48 shapeless dye recipes.
