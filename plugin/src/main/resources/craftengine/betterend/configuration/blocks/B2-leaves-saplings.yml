# BetterEnd B2 -- leaves and saplings for all 10 wood families.
# Worldgen-only: the mod defines NO recipe for any leaf or sapling (generated/data/betterend/recipe/
# contains zero *_leaves / *_sapling entries), so none is declared here.
#
# DEBT (sapling growth): CE's `sapling_block` behavior requires a non-null feature|configured_feature|
# structure id (SaplingBlockBehavior.Factory). Configured features land in the terrain pass, so these
# saplings ship as inert bushes; the upgrade is one extra behavior entry per sapling, nothing else.
#
# DEBT (SAPLING pool): AutoStateGroup.java:57 gives SAPLING only 8 candidates and the pool is NOT
# extendable -- only 16 vanilla sapling states exist and 8 are already mapped, the other 8 being the
# visual anchors. All 9 saplings therefore ride LOWER_TRIPWIRE (63 candidates). No
# `block_state_mappings` section is written: there is nothing left to map.

# ---------------------------------------------------------------------------
# Cube leaves (6). TintedParticleLeavesBlock / HelixTreeLeavesBlock -- a plain full cube.
# map_color is the mod's own LeavesBlockTrait.withColor(MapColor...) -- EndWoodBlocks.java:130-348.
# Shipped NON-tintable (leaves_tintable: false): the mod's value is a MapColor (minimap + particle),
# not a foliage tint, and CE has no per-block tint source for a leaf. 2 candidates each, out of the
# 52 NON_TINTABLE_LEAVES + 52 WATERLOGGED_NON_TINTABLE_LEAVES pools (12 of 104 spent).
# `leaves_block` behavior is deliberately omitted: the template already pins persistent=true,
# distance=7, so LeavesBlockBehavior would have nothing to decay.
# ---------------------------------------------------------------------------
config_factory#b2_cube_leaves:
  instances:
    - family: pythadendron
      leaf_color: color_magenta
      leaf_texture: betterend:block/pythadendron_leaves
    - family: lacugrove
      leaf_color: color_cyan
      leaf_texture: betterend:block/lacugrove_leaves
    - family: dragon_tree
      leaf_color: color_magenta
      leaf_texture: betterend:block/dragon_tree_leaves
    - family: tenanea
      leaf_color: color_pink
      leaf_texture: betterend:block/tenanea_leaves
    # HelixTreeLeavesBlock carries a code-side COLOR 0-7 gradient with no per-level texture;
    # EndWoodBlocks.java:243-252 states 4 is the shade a player actually sees, so one appearance is faithful.
    - family: helix_tree
      leaf_color: color_orange
      leaf_texture: betterend:block/helix_tree_leaves
    # lucernia_leaves has 4 random textures (_1.._4) and no generated blockstate json; _1 is the one the
    # mod itself picks for the item (EndWoodBlocks.java:350). default:block_state/leaves exposes a single
    # texture, so the other 3 are dropped -- restoring them means hand-writing __leaves__ for this one id.
    - family: lucernia
      leaf_color: color_orange
      leaf_texture: betterend:block/lucernia_leaves_1
  blueprint:
    items:
      betterend:${family}_leaves:
        category: betterend:foliage
        settings:
          tags:
            - minecraft:leaves
            - betterend:${family}_leaves
        data:
          item_name: '<!i><white><lang:item.betterend.${family}_leaves></white>'
        model: betterend:block/${family}_leaves
        behavior:
          type: block_item
          block: betterend:${family}_leaves
    blocks:
      betterend:${family}_leaves:
        settings:
          template: default:settings/leaves
          merges:
            map_color: ${leaf_color}
            tags:
              - betterend:${family}_leaves
        loot:
          template: default:loot_table/leaves
          arguments:
            leaves: betterend:${family}_leaves
            sapling: betterend:${family}_sapling
        state:
          template: default:block_state/leaves
          arguments:
            leaves_tintable: false
            leaves_model: betterend:block/${family}_leaves
            leaves_texture: ${leaf_texture}

# ---------------------------------------------------------------------------
# Fur leaves (3). FurBlock is a 6-way face-attached, pass-through decoration -- NOT a cube, so it
# cannot use the leaves pool (leaves states fully occlude and would hide the mesh).
# behavior directional_attached_block binds a 6-direction `facing`
# (DirectionalAttachedBlockBehavior.Factory:105-116, reading "facing" plus attached_block(_tag)s via
# AbstractCanSurviveBlockBehavior.readTagsAndState). `blacklist` defaults to true and both lists are
# omitted, so it survives on any sturdy face -- FurBlock's own rule.
# 6 appearances each = 18 of the 63 LOWER_TRIPWIRE candidates.
# Rotations copied verbatim from generated/assets/betterend/blockstates/<id>.json.
# A weighted `models:` list is ONE appearance and costs ONE candidate
# (AbstractBlockManager.java:615-648), so the 9- and 3-way random variants are free.
# Loot is self, not default:loot_table/leaves: the mod drops glowing_pillar_seed / nothing here and
# those ids belong to other batches.
# ---------------------------------------------------------------------------
items:
  betterend:tenanea_outer_leaves:
    category: betterend:foliage
    settings:
      tags:
        - minecraft:leaves
        - betterend:tenanea_leaves
    data:
      item_name: '<!i><white><lang:item.betterend.tenanea_outer_leaves></white>'
    texture: betterend:block/tenanea_outer_leaves
    behavior:
      type: block_item
      block: betterend:tenanea_outer_leaves
  betterend:lucernia_outer_leaves:
    category: betterend:foliage
    settings:
      tags:
        - minecraft:leaves
        - betterend:lucernia_leaves
    data:
      item_name: '<!i><white><lang:item.betterend.lucernia_outer_leaves></white>'
    texture: betterend:block/lucernia_outer_leaves_1
    behavior:
      type: block_item
      block: betterend:lucernia_outer_leaves
  betterend:glowing_pillar_leaves:
    category: betterend:foliage
    settings:
      tags:
        - minecraft:leaves
    data:
      item_name: '<!i><white><lang:item.betterend.glowing_pillar_leaves></white>'
    texture: betterend:block/glowing_pillar_leaves
    behavior:
      type: block_item
      block: betterend:glowing_pillar_leaves

blocks:
  # EndWoodBlocks.java:217-224 -- MapColor.COLOR_PINK, one creeping_moss-parented mesh, six facings.
  betterend:tenanea_outer_leaves:
    behaviors:
      # DirectionalAttachedBlockBehavior.Factory:113 hardcodes the property name "facing" and reads
      # it off `properties` below; the factory itself takes only attached_block(_tag)s + blacklist.
      - type: directional_attached_block
    settings:
      template: default:settings/leaves
      merges:
        map_color: color_pink
        tags:
          - betterend:tenanea_leaves
    loot:
      template: default:loot_table/self
    state:
      properties:
        facing:
          type: 6-direction
          default: up
      appearances:
        up:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
        down:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
              x: 180
        north:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
              x: 90
        south:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
              x: 90
              y: 180
        east:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
              x: 90
              y: 90
        west:
          auto_state: lower_tripwire
          models:
            - path: betterend:block/tenanea_outer_leaves_t0
              x: 90
              y: 270
      variants:
        facing=up:
          appearance: up
        facing=down:
          appearance: down
        facing=north:
          appearance: north
        facing=south:
          appearance: south
        facing=east:
          appearance: east
        facing=west:
          appearance: west

  # EndWoodBlocks.java:355-359 -- MapColor.COLOR_RED. t0-t8 are the four side faces (bulb_moss parents,
  # 9 weighted variants); t9/t10 are the up/down faces (creeping_moss parent, 2 variants).
