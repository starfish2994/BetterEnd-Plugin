# B3-openable -- BetterEnd doors, trapdoors, fence gates and pressure plates.
#
# WHY THESE ARE CHEAP: door/trapdoor/fence_gate appearances pin a FIXED vanilla state via the
# templates' `state:` key (AbstractBlockManager.java:639 assignFixedBlockState), so they cost ZERO
# auto-state candidates. The state they pin is always `powered=true`, which is visually redundant on
# a vanilla door -- that is the whole trick. The price is one whole vanilla door / trapdoor / gate
# per custom one, so every family below gets its OWN replaced_* type; two families sharing a type
# would collide on the same vanilla state.
#
# Pressure plates no longer touch the shared pool at all: each of the 10 pins its own
# light_weighted_pressure_plate[power=N], N = 4..13. See the note above the plate blueprint.
# STILL SKIPPED, recorded as debt: azure_jadestone_plate, flavolite_plate, sandy_jadestone_plate,
#   sulphuric_rock_plate, umbralith_plate, violecite_plate, virid_jadestone_plate, terminite_plate,
#   thallasium_plate. Only power=14 and power=15 are left unclaimed, i.e. two more plates at most.
#
# NOT IN THIS BATCH: walls / slabs / stairs / buttons / fences -- see the batch report.
#
# Every model below is GENERATED by the state templates from the texture arguments
# (block_states.yml:98-874); the mod's own generated jsons are equivalent
# (generated/models/block/pythadendron_trapdoor_bottom.json ==
#  minecraft:block/template_orientable_trapdoor_bottom + betterend:block/pythadendron_trapdoor),
# so no model json is copied -- only the textures the templates need.

config_factory#b3_wood_openable:
  instances:
    # planks_map_color = the mod's EndWoodenComplexMaterial(name, woodColor, planksColor) second
    # colour -- EndWoodBlocks.java:121-365. replaced_type is this family's exclusive vanilla donor.
    # WAS `oak`. CrabbersDelight's palm_door / palm_trapdoor / palm_fence_gate pin the same oak
    # states, and whoever loads second silently loses its model binding (latest.log:246,268,269).
    # crimson is free here because terminite_door / terminite_trapdoor moved to the copper family
    # below, and crimson_fence_gate was never claimed by anyone.
    - tree_type: pythadendron
      planks_map_color: color_purple
      replaced_type: crimson
      plate_power: 4
    - tree_type: lacugrove
      planks_map_color: color_yellow
      replaced_type: spruce
      plate_power: 5
    - tree_type: dragon_tree
      planks_map_color: color_magenta
      replaced_type: birch
      plate_power: 6
    - tree_type: tenanea
      planks_map_color: color_pink
      replaced_type: jungle
      plate_power: 7
    - tree_type: helix_tree
      planks_map_color: color_orange
      replaced_type: acacia
      plate_power: 8
    - tree_type: lucernia
      planks_map_color: color_orange
      replaced_type: dark_oak
      plate_power: 9
    - tree_type: mossy_glowshroom
      planks_map_color: wood
      replaced_type: mangrove
      plate_power: 10
    - tree_type: jellyshroom
      planks_map_color: color_light_blue
      replaced_type: cherry
      plate_power: 11
    - tree_type: end_lotus
      planks_map_color: color_cyan
      replaced_type: bamboo
      plate_power: 12
    # pale_oak_{door,trapdoor,fence_gate} exist from MC 1.21.4, the pack's own floor.
    - tree_type: umbrella_tree
      planks_map_color: color_green
      replaced_type: pale_oak
      plate_power: 13
  blueprint:
    items:
      betterend:${tree_type}_door:
        category: betterend:openable
        settings:
          fuel_time: 200
          # ITEM tags, verbatim from generated/data/minecraft/tags/item/{doors,wooden_doors}.json.
          tags:
            - minecraft:doors
            - minecraft:wooden_doors
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_door></white>'
        # The mod ships the door icon at assets/betterend/textures/item/<f>_door.png; the live pack
        # already stages that exact png under textures/block/, so keep that path.
        texture: betterend:block/${tree_type}_door
        behavior:
          type: double_high_block_item
          block: betterend:${tree_type}_door
      betterend:${tree_type}_trapdoor:
        category: betterend:openable
        settings:
          fuel_time: 300
          tags:
            - minecraft:trapdoors
            - minecraft:wooden_trapdoors
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_trapdoor></white>'
        model: betterend:block/${tree_type}_trapdoor_bottom
        behavior:
          type: block_item
          block: betterend:${tree_type}_trapdoor
      betterend:${tree_type}_gate:
        category: betterend:openable
        settings:
          fuel_time: 300
          tags:
            - minecraft:fence_gates
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_gate></white>'
        model: betterend:block/${tree_type}_gate
        behavior:
          type: block_item
          block: betterend:${tree_type}_gate
      betterend:${tree_type}_plate:
        category: betterend:openable
        settings:
          fuel_time: 300
          tags:
            - minecraft:wooden_pressure_plates
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_plate></white>'
        model: betterend:block/${tree_type}_plate
        behavior:
          type: block_item
          block: betterend:${tree_type}_plate
    blocks:
      betterend:${tree_type}_door:
        behavior:
          type: door_block
          can_open_with_hand: true
          can_open_by_wind_charge: true
          sounds:
            open: minecraft:block.wooden_door.open
            close: minecraft:block.wooden_door.close
        settings:
          template:
            - default:sound/wood
            - default:burn_data/planks
          merges:
            hardness: 3.0
            resistance: 3.0
            push_reaction: destroy
            instrument: bass
            map_color: ${planks_map_color}
            tags:
              - minecraft:mineable/axe
              - minecraft:doors
              - minecraft:wooden_doors
        loot:
          template: default:loot_table/door
        state:
          template: default:block_state/door
          arguments:
            door_base_block: ${replaced_type}_door
            door_model: betterend:block/${tree_type}_door
            door_texture_top: betterend:block/${tree_type}_door_top
            door_texture_bottom: betterend:block/${tree_type}_door_bottom
      betterend:${tree_type}_trapdoor:
        behavior:
          type: trapdoor_block
          can_open_with_hand: true
          can_open_by_wind_charge: true
          sounds:
            open: minecraft:block.wooden_trapdoor.open
            close: minecraft:block.wooden_trapdoor.close
        settings:
          template:
            - default:sound/wood
            - default:burn_data/planks
          merges:
            hardness: 3.0
            resistance: 3.0
            instrument: bass
            map_color: ${planks_map_color}
            tags:
              - minecraft:mineable/axe
              - minecraft:trapdoors
              - minecraft:wooden_trapdoors
        loot:
          template: default:loot_table/self
        state:
          template: default:block_state/trapdoor
          arguments:
            trapdoor_base_block: ${replaced_type}_trapdoor
            trapdoor_model: betterend:block/${tree_type}_trapdoor
            trapdoor_texture: betterend:block/${tree_type}_trapdoor
      betterend:${tree_type}_gate:
        behavior:
          type: fence_gate_block
          can_open_with_hand: true
          can_open_by_wind_charge: true
          sounds:
            open: minecraft:block.fence_gate.open
            close: minecraft:block.fence_gate.close
        settings:
          template:
            - default:sound/wood
            - default:burn_data/planks
            - default:hardness/planks
          merges:
            instrument: bass
            map_color: ${planks_map_color}
            tags:
              - minecraft:mineable/axe
              - minecraft:fence_gates
              - minecraft:unstable_bottom_center
        loot:
          template: default:loot_table/self
        state:
          template: default:block_state/fence_gate
          arguments:
            fence_gate_base_block: ${replaced_type}_fence_gate
            fence_gate_model: betterend:block/${tree_type}_gate
            fence_gate_texture: betterend:block/${tree_type}_planks
      betterend:${tree_type}_plate:
        behavior:
          type: pressure_plate_block
          sensitivity: all
          pressed_time: 20
          sounds:
            # quoted: YAML 1.1 resolves bare on/off to booleans
            'on': minecraft:block.wooden_pressure_plate.click_on
            'off': minecraft:block.wooden_pressure_plate.click_off
        settings:
          template:
            - default:sound/wood
            - default:burn_data/planks
          merges:
            hardness: 0.5
            resistance: 0.5
            push_reaction: destroy
            instrument: bass
            map_color: ${planks_map_color}
            tags:
              - minecraft:mineable/axe
              - minecraft:wall_post_override
              - minecraft:pressure_plates
              - minecraft:wooden_pressure_plates
        loot:
          template: default:loot_table/self
        # default:block_state/pressure_plate is `auto_state: pressure_plate` twice, and half that
        # 28-state pool is poisoned by the FarmersDelight double-issue described in the instances
        # note above. Pinning an explicit light_weighted_pressure_plate state sidesteps it: fd never
        # re-declares the light plates, CrabbersDelight holds only power=2 and power=3
        # (palm_tree.yml:446,454), and assignFixedBlockState claims a state outright so no later
        # auto-allocation can take it. Shape is unchanged -- a weighted plate is the same flat
        # 1/16 no-collision pad as a wooden one.
        # DEVIATION: one appearance instead of two, so the plate no longer renders 1px lower while
        # pressed. `powered` still exists and pressure_plate_block still toggles it and emits
        # redstone; only the depressed MODEL is gone. Two appearances would need 20 states and only
        # 12 unclaimed light-plate states exist.
        state:
          properties:
            powered:
              type: boolean
              default: false
          appearances:
            normal:
              state: light_weighted_pressure_plate[power=${plate_power}]
              model:
                path: betterend:block/${tree_type}_plate
                generation:
                  parent: minecraft:block/pressure_plate_up
                  textures:
                    texture: betterend:block/${tree_type}_planks
          variants:
            powered=false:
              appearance: normal
            powered=true:
              appearance: normal
    recipes:
      # Verbatim from generated/data/betterend/recipe/<id>.json.
      betterend:${tree_type}_door:
        type: shaped
        category: redstone
        group: door
        pattern:
          - AA
          - AA
          - AA
        ingredients:
          A: betterend:${tree_type}_planks
        result:
          id: betterend:${tree_type}_door
          count: 3
      betterend:${tree_type}_trapdoor:
        type: shaped
        category: redstone
        group: wooden_trapdoor
        pattern:
          - AAA
          - AAA
        ingredients:
          A: betterend:${tree_type}_planks
        result:
          id: betterend:${tree_type}_trapdoor
          count: 2
      betterend:${tree_type}_gate:
        type: shaped
        category: redstone
        group: gate
        pattern:
          - BAB
          - BAB
        ingredients:
          A: betterend:${tree_type}_planks
          B: minecraft:stick
        result:
          id: betterend:${tree_type}_gate
          count: 1
      betterend:${tree_type}_plate:
        type: shaped
        category: redstone
        group: pressure_plate
        pattern:
          - AA
        ingredients:
          A: betterend:${tree_type}_planks
        result:
          id: betterend:${tree_type}_plate
          count: 1

# Metal doors/trapdoors. The mod builds them from WoodSlots.DOOR / WoodSlots.TRAPDOOR
# (MetalMaterial.java:221-222), so they open by hand with wooden door sounds, while
# addCommonBlockDefinitions (MetalMaterial.java:182-188) gives them MapColor + SoundType.IRON +
# iron_xylophone + requiresCorrectToolForDrops. terminite overrides strength to 7/9 via makeOreless
# (EndMetalBlocks.java:85-98), applied after the shared strength(5,6) at MetalMaterial.java:187.
config_factory#b3_metal_openable:
  instances:
    - metal_type: terminite
      metal_map_color: warped_wart_block
      metal_hardness: 7.0
      metal_resistance: 9.0
      # EndMetalBlocks.java:97 BlockTags.NEEDS_IRON_TOOL
      metal_break_power: 2
      metal_tier_tag: minecraft:needs_iron_tool
      # WAS `crimson`, handed to pythadendron above so it could vacate oak. copper_door /
      # copper_trapdoor are mapped onto their waxed twins (internal/mappings.yml:2117+,:2799+),
      # sit in no AutoStateGroup, and are claimed by no pack on this server. terminite has no
      # fence gate, so the missing copper_fence_gate does not matter.
      replaced_type: copper
    - metal_type: thallasium
      metal_map_color: color_blue
      metal_hardness: 5.0
      metal_resistance: 6.0
      # EndMetalBlocks.java:106 BlockTags.NEEDS_STONE_TOOL
      metal_break_power: 1
      metal_tier_tag: minecraft:needs_stone_tool
      replaced_type: warped
  blueprint:
    items:
      betterend:${metal_type}_door:
        category: betterend:openable
        settings:
          # item/doors.json lists both metal doors; item/wooden_doors.json does not.
          tags:
            - minecraft:doors
        data:
          item_name: '<!i><white><lang:item.betterend.${metal_type}_door></white>'
        texture: betterend:block/${metal_type}_door
        behavior:
          type: double_high_block_item
          block: betterend:${metal_type}_door
      betterend:${metal_type}_trapdoor:
        category: betterend:openable
        settings:
          tags:
            - minecraft:trapdoors
        data:
          item_name: '<!i><white><lang:item.betterend.${metal_type}_trapdoor></white>'
        model: betterend:block/${metal_type}_trapdoor_bottom
        behavior:
          type: block_item
          block: betterend:${metal_type}_trapdoor
    blocks:
      betterend:${metal_type}_door:
        behavior:
          type: door_block
          can_open_with_hand: true
          can_open_by_wind_charge: true
          sounds:
            open: minecraft:block.wooden_door.open
            close: minecraft:block.wooden_door.close
        settings:
          template:
            - default:sound/metal
          merges:
            hardness: ${metal_hardness}
            resistance: ${metal_resistance}
            push_reaction: destroy
            instrument: iron_xylophone
            map_color: ${metal_map_color}
            correct_tools: ['#minecraft:pickaxes']
            required_break_power: ${metal_break_power}
            tags:
              - minecraft:mineable/pickaxe
              - minecraft:doors
              - ${metal_tier_tag}
        loot:
          template: default:loot_table/door
        state:
          template: default:block_state/door
          arguments:
            door_base_block: ${replaced_type}_door
            door_model: betterend:block/${metal_type}_door
            door_texture_top: betterend:block/${metal_type}_door_top
            door_texture_bottom: betterend:block/${metal_type}_door_bottom
      betterend:${metal_type}_trapdoor:
        behavior:
          type: trapdoor_block
          can_open_with_hand: true
          can_open_by_wind_charge: true
          sounds:
            open: minecraft:block.wooden_trapdoor.open
            close: minecraft:block.wooden_trapdoor.close
        settings:
          template:
            - default:sound/metal
          merges:
            hardness: ${metal_hardness}
            resistance: ${metal_resistance}
            instrument: iron_xylophone
            map_color: ${metal_map_color}
            correct_tools: ['#minecraft:pickaxes']
            required_break_power: ${metal_break_power}
            tags:
              - minecraft:mineable/pickaxe
              - minecraft:trapdoors
              - ${metal_tier_tag}
        loot:
          template: default:loot_table/self
        state:
          template: default:block_state/trapdoor
          arguments:
            trapdoor_base_block: ${replaced_type}_trapdoor
            trapdoor_model: betterend:block/${metal_type}_trapdoor
            trapdoor_texture: betterend:block/${metal_type}_trapdoor
    recipes:
      # Verbatim from generated/data/betterend/recipe/{terminite,thallasium}_{door,trapdoor}.json.
      # DEPENDS ON B7: betterend:<metal>_block is defined in the B7-metals batch. If B7 does not
      # ship, delete these two recipes -- the blocks themselves stay valid and craftless.
      betterend:${metal_type}_door:
        type: shaped
        category: redstone
        group: door
        pattern:
          - AA
          - AA
          - AA
        ingredients:
          A: betterend:${metal_type}_block
        result:
          id: betterend:${metal_type}_door
          count: 3
      betterend:${metal_type}_trapdoor:
        type: shaped
        category: redstone
        group: trapdoor
        pattern:
          - AAA
          - AAA
        ingredients:
          A: betterend:${metal_type}_block
        result:
          id: betterend:${metal_type}_trapdoor
          count: 2
