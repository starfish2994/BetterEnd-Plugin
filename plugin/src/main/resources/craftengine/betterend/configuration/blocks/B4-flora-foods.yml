# BetterEnd -- batch B4 (flora-a): the plant foods and drops.
# Food values are the mod's own (EndFoodItems.java:52-108); MobEffect side effects are dropped --
# `settings.food` is parsed by FoodData.fromConfig, which reads ONLY nutrition and saturation
# (FoodData.java:5-12, wired at ItemSettingsModifiers.java:194-197) -- no effects and not even
# can_always_eat -- so shadow_berry_jelly loses its 20s Night Vision.
items:
  betterend:amber_root_raw:
    category: betterend:flora
    data:
      item_name: '<!i><white><lang:item.betterend.amber_root_raw></white>'
    texture: betterend:item/amber_root_raw
    settings:
      food:
        nutrition: 2
        saturation: 3.2
