# Only the recipes whose every ingredient exists in this batch or in vanilla are shipped.
# Deferred, with the batch that unblocks them:
#   blossom_berry_jelly / shadow_berry_jelly / sweet_berry_jelly -- need betterend:gelatine (B8)
#     and the #wover:water_bottles tag, which has no Bukkit equivalent.
#   enchanted_petal -- betterend:infusion recipe type (the infusion pedestal ritual); there is
#     no CraftEngine recipe serializer for it (RecipeSerializers.java:13-25).
recipes:
  # generated/data/betterend/recipe/shadow_berry_seeds.json
  betterend:shadow_berry_seeds:
    type: shapeless
    ingredients:
      - betterend:shadow_berry_raw
    result:
      id: betterend:shadow_berry
      count: 4
  # generated/data/betterend/recipe/chorus_mushroom_campfire.json
  betterend:chorus_mushroom_campfire:
    type: campfire_cooking
    category: food
    time: 600
    ingredient: betterend:chorus_mushroom_raw
    result:
      id: betterend:chorus_mushroom_cooked
  # generated/data/betterend/recipe/chorus_mushroom_smoker.json
  betterend:chorus_mushroom_smoker:
    type: smoking
    category: food
    ingredient: betterend:chorus_mushroom_raw
    result:
      id: betterend:chorus_mushroom_cooked
  # generated/data/betterend/recipe/end_lily_leaf_dried_smelting.json
  betterend:end_lily_leaf_dried_smelting:
    type: smelting
    ingredient: betterend:end_lily_leaf
    result:
      id: betterend:end_lily_leaf_dried
  # generated/data/betterend/recipe/cave_pumpkin_pie.json -- B accepts either berry, which
  # AbstractRecipeSerializer.java:86-121 supports as a list ingredient.
  betterend:cave_pumpkin_pie:
    type: shaped
    pattern:
      - SBS
      - BPB
      - SBS
    ingredients:
      S: minecraft:sugar
      B:
        - betterend:blossom_berry
        - betterend:shadow_berry_raw
      P: betterend:cave_pumpkin
    result:
      id: betterend:cave_pumpkin_pie
