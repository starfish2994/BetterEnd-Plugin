# BetterEnd B8-storage -- the wood families' functional furniture.
# 10 families x 5 shippable ids = 50 blocks. The other 6 ids of each family are recorded as
# unportable at the bottom of this file.
#
# Placement rotation is free: a property literally named `facing` gets mirror/rotate/placement
# wired up by HardcodedPropertyBlockBehavior (installed in BukkitBlockManager.java:174-177,
# table at HardcodedPropertyBlockBehavior.java:43-68). 4 values -> horizontal-looking opposite,
# 6 values -> nearest-looking opposite. No behavior entry is needed for it.
#
# Settings: `default:settings/planks` (block_settings.yml:56-65) is the wood base -- sound/wood,
# burn_data/planks, hardness/planks, solid_1x1x1 and tag minecraft:mineable/axe. `merges:` then
# raises hardness to the vanilla value each shape actually uses. NEVER `overrides:` -- that is a
# shallow putAll and would discard the template's own tags.
#
# planks_map_color is the mod's own second MapColor argument to
# EndWoodenComplexMaterial(name, woodColor, planksColor) -- EndWoodBlocks.java:121-365.

config_factory#b8_wood_furniture:
  instances:
    - wood: dragon_tree
      planks_map_color: color_magenta
      # ladder shape donors: an OPEN trapdoor is a 3px panel on the
      # side opposite `facing` -- the same box vanilla LadderBlock uses.
      ld_north: 'exposed_copper_trapdoor[facing=north,half=bottom,open=true,powered=true,waterlogged=false]'
      ld_south: 'exposed_copper_trapdoor[facing=south,half=bottom,open=true,powered=true,waterlogged=false]'
      ld_east: 'exposed_copper_trapdoor[facing=east,half=bottom,open=true,powered=true,waterlogged=false]'
