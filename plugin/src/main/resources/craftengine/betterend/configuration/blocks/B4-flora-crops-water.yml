  # EndLotusLeafBlock -- defineBlockOnly. The mod tiles 3x3 lily pads with shape x facing (12
  # states); the facing half is dropped here because CraftEngine cannot reproduce the
  # neighbour-driven tiling without the worldgen feature, so only the north models are bound.
  betterend:end_lotus_leaf:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      merges:
        push_reaction: destroy
        map_color: plant
        tags:
          - minecraft:sword_efficient
          - minecraft:mineable/hoe
    behavior:
      - type: on_liquid_block
        liquid_type:
          - water
    loot:
      template: default:loot_table/self
    state:
      properties:
        shape:
          type: string
          values: [bottom, middle, top]
          default: bottom
      # REVERSE MISMATCH, fixed. EndLotusLeafBlock.java:29,32 extends Block with
      # VSHAPE = box(0,0,0,16,1,16) -- a walkable lily-pad platform. `auto_state: higher_tripwire`
      # gave it the tripwire donor's NO collision, so you fell straight through a lotus leaf.
      # Collision is not overridable (BukkitBlockShape.java:20-26), so this pins a closed trapdoor
      # state: a 3px walkable pad, the thinnest solid platform vanilla has. 2px too thick, but
      # walkable, which is the point. These are copper trapdoor states freed at
      # internal/mappings.yml:2117+, in no AutoStateGroup and unclaimed by any pack here -- and
      # moving the leaf off higher_tripwire returns 3 slots to the oversubscribed tripwire pool.
      # UNVERIFIED: wover's PlantBlockTrait is not in Reference/, so I could not rule out that the
      # trait adds noCollission() on top of the class's own VSHAPE. If lotus leaves turn out to be
      # pass-through in the mod, revert these three to `auto_state: higher_tripwire`.
      appearances:
        bottom:
          state: waxed_weathered_copper_trapdoor[facing=south,half=bottom,open=false,powered=true,waterlogged=false]
          model: betterend:block/end_lotus_leaf_bottom_north
        middle:
          state: waxed_weathered_copper_trapdoor[facing=east,half=bottom,open=false,powered=true,waterlogged=false]
          model: betterend:block/end_lotus_leaf_middle_north
        top:
          state: waxed_weathered_copper_trapdoor[facing=west,half=bottom,open=false,powered=true,waterlogged=false]
          model: betterend:block/end_lotus_leaf_top_north
      variants:
        shape=bottom:
          appearance: bottom
        shape=middle:
          appearance: middle
        shape=top:
          appearance: top
