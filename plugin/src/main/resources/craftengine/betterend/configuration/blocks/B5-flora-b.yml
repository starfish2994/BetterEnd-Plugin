blocks:
  # === WALL PLANTS =========================================================
  # All nine are bclib BaseWallPlantBlock + SurvivesOnSolidTrait.DEFAULT
  # (EndWallPlantBlocks.java:71-140). CE equivalent: directional_attached_block, whose factory
  # defaults `blacklist` to true (DirectionalAttachedBlockBehavior.java:114), so an EMPTY
  # attached_blocks list means "sticks to any sturdy face" -- exactly SurvivesOnSolidTrait.DEFAULT
  # (mayPlaceOn falls through to `return this.blacklistMode`, :77).
  # The four rotations are the mod's own blockstate json: south y0 / west y90 / north y180 /
  # east y270. Random model variants cost nothing: one appearance holds the whole `models:` list.
  betterend:aurant_polypore:
    behavior:
      type: directional_attached_block
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      merges:
        push_reaction: destroy
        map_color: color_orange
        luminance: 13
        tags:
          - minecraft:mineable/hoe
          - minecraft:sword_efficient
    loot:
      template: default:loot_table/self
    state:
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        north:
          auto_state: cave_vines
          models:
            - path: betterend:block/aurant_polypore_1
              y: 180
              weight: 1
            - path: betterend:block/aurant_polypore_2
              y: 180
              weight: 1
            - path: betterend:block/aurant_polypore_3
              y: 180
              weight: 1
        east:
