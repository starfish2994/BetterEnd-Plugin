  # === HANGING VINES =======================================================
  # bclib BaseVineBlock: a TripleShape (top/middle/bottom) column hanging from the block above.
  # CE has no triple_shape property type (Properties.java:16-31), so `shape` is a plain string
  # property carrying the mod's own three value names -- byte-identical to its blockstate keys.
  # Survival is hanging_block, which checks the block ABOVE (HangingBlockBehavior.java:31-33):
  #   blacklist: true + above_block_tags [minecraft:replaceable]  ==  "dies when what is above
  #   turns into air/water/grass, survives under anything solid", which is BaseVineBlock's rule.
  # Self-stacking is free: BushBlockBehavior.java:80-85 short-circuits a custom state of the same
  # block to the stackable/max_height check.
  # NOT ported: vine tip growth. vine_crop_head_block + vine_crop_body_block need TWO ids per vine
  # and the mod gives each vine exactly one. `shape` is inert -- worldgen writes it.
  betterend:blue_vine:
    behavior:
      type: hanging_block
      blacklist: true
      stackable: true
      max_height: 16
      above_block_tags:
        - minecraft:replaceable
    settings:
      template:
        - default:hardness/none
        - default:sound/vine
      merges:
        push_reaction: destroy
        map_color: color_blue
        luminance: 15
        tags:
          - minecraft:mineable/hoe
          - minecraft:sword_efficient
    loot:
      template: default:loot_table/self
    state:
      properties:
        shape:
          type: string
          values:
            - top
            - middle
            - bottom
          default: bottom
      appearances:
        top:
          auto_state: weeping_vines
          model: betterend:block/blue_vine_top
        middle:
          auto_state: weeping_vines
          model: betterend:block/blue_vine
        bottom:
          auto_state: weeping_vines
          model: betterend:block/blue_vine_roots
      variants:
        shape=top:
          appearance: top
        shape=middle:
          appearance: middle
        shape=bottom:
          appearance: bottom
