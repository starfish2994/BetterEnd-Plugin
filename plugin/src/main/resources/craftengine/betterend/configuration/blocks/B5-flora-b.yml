# BetterEnd -- batch B5 "flora-b": vines, wall plants, mushrooms, crystals and stalactites.
# 41 of the 42 ids the manifest assigns to B5 (vent_bubble_column is unportable; see the tail of
# this file), plus the 8 standalone B5 items.
#
# STYLE: settings are always `template:` + `merges:` -- merges deep-merges and concatenates lists
# (TemplateManagerImpl.java:145-146), so the template's own tags survive. `overrides:` is a shallow
# putAll and is never used here, even though CE's shipped examples do.
# Display names live in configuration/langs/b5_en_us.yml, never inline.
#
# AUTO-STATE POOLS THIS FILE CONSUMES (AutoStateGroup.java:11-58; one appearance = one candidate,
# AbstractBlockManager.java:615-648 -- a weighted `models:` list still costs exactly one).
# Pools are chosen so B5 leaves the big `tripwire` pool (126) almost untouched for B2/B4. B4
# consumes two cave_vines states with its already-luminous umbrella mosses:
#   cave_vines     48 / 50   9 wall plants x4 facing, small_jellyshroom 6, filalux_wings 6
#   weeping_vines  24 / 25   8 hanging vines x3 shape
#   twisting_vines  3 / 25   large_amaranita 3        (WAS 24; see the 2026 remap note below)
#   kelp           18 / 25   sulphur_crystal 3 age x6 facing
#   sapling         5 /  8   glowing_pillar_roots 3, bolux 1, small_amaranita 1
#   higher_tripwire 6        smaragdant_crystal_shard 6 facing
#   tripwire       12 / 126  blue_vine_fur 6, amaranita_fur 6
#   solid          45        2 stalactites x16, amaranita pillars/cubes 9, budding 3,
#                            aurora_crystal 1, hydrothermal_vent 1
#   explicit        7        lumecorn, on lightning-rod states (see its own note)
#
# 2026 REMAP. FarmersDelight holds 20 of the 25 twisting_vines states and 5 of the 25 kelp states
# on this server, so B5's old 24/25 in each was oversubscribed the moment fd loaded -- latest.log
# recorded 7 twisting_vines and 1 kelp exhaustion failures out of this file alone. Four *_seed
# growth blocks (16 states) were unshipped with the deferred growth blocks; glowing_pillar_roots,
# bolux_mushroom and small_amaranita_mushroom moved to the idle `sapling` pool (8 states, 1 used by
# CrabbersDelight) and smaragdant_crystal_shard moved to higher_tripwire. All four donors are
# NO-collision, which is the developer's standing ruling for sulphur_crystal and
# smaragdant_crystal_shard: they must never land on a donor that has a hitbox.
# CHORUS is not used anywhere here -- the pool is empty (mappings.yml:4411-4474 all commented out)
# and chorus_plant's hitbox is unusable for flora.

