  # === HYDROTHERMAL VENT ===================================================
  # EndStoneBlocks.java:285-294, a decorative sulphuric-rock geyser. The mod's blockstate json is
  # one variant with four y rotations, folded here into a SINGLE appearance holding four weighted
  # models -- one visual state, not four. The mod's noCollission() has no analogue on a solid host,
  # so the vent is walk-on-able. NOT ported: the paired vent_bubble_column emitter (see the tail).
  betterend:hydrothermal_vent:
    settings:
      template:
        - default:hardness/stone
        - default:sound/stone
        - default:settings/transparent_1x1x1
      merges:
        hardness: 1.5
        resistance: 6.0
        map_color: color_yellow
        instrument: basedrum
        require_correct_tools: true
        required_break_power: 0
        correct_tools:
          - '#minecraft:pickaxes'
        tags:
          - minecraft:mineable/pickaxe
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      models:
        - path: betterend:block/hydrothermal_vent
          weight: 1
        - path: betterend:block/hydrothermal_vent
          y: 90
          weight: 1
        - path: betterend:block/hydrothermal_vent
          y: 180
          weight: 1
        - path: betterend:block/hydrothermal_vent
          y: 270
          weight: 1

