  # === LUMECORN ============================================================
  # LumecornBlock.java:44 EnumProperty<LumecornShape>, 7 values; the names below are verbatim from
  # the mod's own blockstates/lumecorn.json. No item (defineBlockOnly, EndMushroomBlocks.java:179).
  # Loot is LumecornBlock.buildLoot (:104-123) reproduced literally: the three stem shapes give
  # 1-2 lumecorn_seed, the four light shapes give lumecorn_rod at 50%. lumecorn_rod has no other
  # source in the mod, so this table is load-bearing.
  # A tripwire host has no collision, so the mod's 4x16x4 stalk hitbox is lost -- recorded.
  betterend:lumecorn:
    settings:
      template:
        - default:hardness/wood
        - default:sound/wood
      merges:
        hardness: 0.5
        resistance: 0.5
        push_reaction: destroy
        map_color: color_light_blue
        luminance: 15
        tags:
          - minecraft:mineable/axe
    # The mod's first pool (1-2 lumecorn_seed from bottom_big / bottom_small / middle) is dropped:
    # lumecorn_seed was unshipped with the deferred growth blocks. The rod pool below is unchanged.
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: inverted
              term:
                type: any_of
                terms:
                  - type: match_block_property
                    properties:
                      shape: bottom_big
                  - type: match_block_property
                    properties:
                      shape: bottom_small
                  - type: match_block_property
                    properties:
                      shape: middle
            - type: random
              value: 0.5
          entries:
            - type: item
              item: betterend:lumecorn_rod
    state:
      properties:
        shape:
          type: string
          values:
            - bottom_big
            - bottom_small
            - middle
            - light_bottom
            - light_middle
            - light_top_middle
            - light_top
          default: bottom_small
      # REVERSE MISMATCH, fixed. LumecornBlock.java:43,48-49 extends Block with
      # SHAPE = box(6,0,6,10,16,10) and NO noCollission -- a lumecorn trunk is solid and standable in
      # the mod, but `auto_state: tripwire` gave it the tripwire donor's NO collision, so you walked
      # straight through it and could not stand on one. Collision is not overridable
      # (BukkitBlockShape.java:20-26), so the donor has to be the right shape: a lightning rod, whose
      # vanilla box for a vertical facing is box(6,0,6,10,16,10) -- byte-identical to the mod's.
      # facing=up and facing=down both resolve to the Y box (RodBlock keys off facing.getAxis()), so
      # all seven appearances stay vertical. The powered=true half of each family is used here; the
      # powered=false half backs the four chandeliers in B6.
      # These states are freed by internal/mappings.yml:4072+ onto their waxed twins, sit in no
      # AutoStateGroup, and are claimed by no pack on this server -- and moving lumecorn off tripwire
      # also returns 7 slots to the oversubscribed 126-state tripwire pool.
      appearances:
        bottom_big:
          state: lightning_rod[facing=up,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_roots_big
        bottom_small:
          state: lightning_rod[facing=down,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_roots_small
        middle:
          state: exposed_lightning_rod[facing=up,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_middle
        light_bottom:
          state: exposed_lightning_rod[facing=down,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_light_bottom
        light_middle:
          state: weathered_lightning_rod[facing=up,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_light_middle
        light_top_middle:
          state: weathered_lightning_rod[facing=down,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_light_top_middle
        light_top:
          state: oxidized_lightning_rod[facing=up,powered=true,waterlogged=false]
          model: betterend:block/lumecorn_light_top
      variants:
        shape=bottom_big:
          appearance: bottom_big
        shape=bottom_small:
          appearance: bottom_small
        shape=middle:
          appearance: middle
        shape=light_bottom:
          appearance: light_bottom
        shape=light_middle:
          appearance: light_middle
        shape=light_top_middle:
          appearance: light_top_middle
        shape=light_top:
          appearance: light_top

  # === CRYSTALS ============================================================
  # SulphurCrystalBlock: AGE 0-2 x 6-direction FACING, grows on brimstone
  # (EndStoneBlocks.java:150 withTag(SURVIVES_ON_BRIMSTONE)). That tag also lists
  # minecraft:cinnabar and minecraft:sulfur, which do not exist in this build, so only
  # betterend:brimstone (a live Phase-2 id) is listed.
  # WATERLOGGED is NOT ported: it would double 18 appearances to 36 for no visual gain.
  betterend:sulphur_crystal:
    behavior:
      type: directional_attached_block
      blacklist: false
      attached_blocks:
        - betterend:brimstone
    settings:
      template:
        - default:hardness/stone
        - default:sound/stone
      merges:
        hardness: 0.5
        resistance: 0.5
        push_reaction: destroy
        map_color: color_yellow
        # No require_correct_tools: EndStoneBlocks.java:148-154 registers sulphur_crystal with
        # MINEABLE_WITH.needsPickAxe() only -- it never calls requiresCorrectToolForDrops(),
        # unlike hydrothermal_vent five entries above it (:290). correct_tools below is kept
        # because it still governs mining speed.
        correct_tools:
          - '#minecraft:pickaxes'
        tags:
          - minecraft:mineable/pickaxe
    loot:
      # SulphurCrystalBlock.buildLoot (:87-125). The mod's second pool is gated on age==3 while
      # AGE only reaches 2 (:55) -- a dead condition, so in the mod the block silently drops
      # nothing without silk touch. Ported to the evident intent: ripe age 2 yields sulfur.
      pools:
        - rolls: 1
          conditions:
            - type: enchantment
              predicate: minecraft:silk_touch>=1
          entries:
            - type: item
              item: betterend:sulphur_crystal
        - rolls: 1
          conditions:
            - type: inverted
              term:
