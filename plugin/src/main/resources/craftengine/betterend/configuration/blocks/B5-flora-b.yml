# ============================================================================
# RECIPES THE MOD DEFINES AND CE CANNOT EXPRESS -- deliberately NOT written:
#   ender_dust        ender_pearl_to_dust.json / ender_shard_to_dust.json are `bclib:smithing`
#                     on a LeveledAnvil (anvilLevel 2). No CE behavior implements a leveled anvil
#                     and the anvils themselves are in the SKIP set. ender_dust therefore ships as
#                     an item with no obtaining route until that lands.
#   eternal_crystal   eternal_crystal.json is `betterend:infusion`, an 8-catalyst pedestal ritual
#                     (infusion_pedestal is a B8 id). No CE recipe type comes close.
#   crystalline_sulphur -> minecraft:sulfur_spike (crystalline_sulphur_to_sulfur_spike.json): the
#                     result item does not exist in this build, so the recipe is dropped.
#   crystal_shards / glowing_bulb / lumecorn_rod are loot-only and their tables are above.
#
# IDS IN B5 NOT CONVERTED (1 of 42):
#   vent_bubble_column -- VentBubbleColumnBlock (EndStoneBlocks.java:296-299) is a
#                     replacePropertiesWithCopy(Blocks.BUBBLE_COLUMN) emitter registered with
#                     defineBlockOnly + noLootTable: no item, no texture, no model and no
#                     blockstate anywhere in the mod's assets, and no CE behavior produces a
#                     bubble column. There is literally nothing to convert.
#
# DEVIATIONS RECORDED (all deliberate, none blocking):
#   * OffsetType.XZ / XYZ -- the mod's per-plant random jitter (e.g. small_jellyshroom,
#     EndMushroomBlocks.java:143) has no CE analogue; plants sit grid-aligned.
#   * per-state luminance (large_amaranita top-only, glowing_pillar_seed age*3+3, filalux and
#     bulb_vine bottom-only) collapses to one per-block value.
#   * vine `shape`, stalactite `size`/`hanging` and seed growth targets are inert properties:
#     worldgen writes them, nothing maintains them at runtime.
#   * aurora_crystal ships untinted.
#   * blue_vine_fur / amaranita_fur lose their 1/15 seed drop (see the FUR BLOCKS note).
#   * sulphur_crystal loses its waterlogged state.




