# NO RECIPES: every block below is worldgen-only in the mod (no recipe json under
# generated/data/betterend/recipe). The mod makes the *_path blocks with a shovel in-world;
# CraftEngine has no shovel-interaction behavior, so here they are placeable items only.
blocks:
  betterend:amber_moss:
    settings:
      template:
        - default:sound/grass
        - default:settings/solid_1x1x1
      merges:
        hardness: 0.5
        resistance: 0.5
        map_color: plant
        is_randomly_ticking: true
        tags:
          - minecraft:mineable/pickaxe
          - minecraft:nylium
    behavior:
      - type: surface_spreading_block
        base_block: minecraft:end_stone
        light_requirement: 9
        max_light_requirement: 15
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      models:
        - path: betterend:block/amber_moss_1
        - path: betterend:block/amber_moss_1
