# BetterEnd -- batch B4 (flora-a): ground cross-plants, mosses and bushes
# Generated from the mod's own blockstate/model json; every `models:` list is a verbatim
# transcription of the mod's weighted variant list (AbstractBlockManager.java:988-1022 accepts
# path/x/y/z/uvlock/weight on a block-state model entry, exactly as vanilla does).
# One appearance = one visual state no matter how many weighted models it holds
# (AbstractBlockManager.java:615-648), so the random variants are free.
#
# AUTO-STATE POOLS (revised after the cross-batch audit): B4 uses two cave_vines states for its
# already-luminous twisted_umbrella_moss and umbrella_moss blocks. B5-flora-b claims 48/50
# cave_vines (and 24/25 weeping_vines); the two cave_vines draws therefore fill that pool without
# introducing a new non-luminous plant into a berries=true donor.
# (VisualBlockStateAllocator.java:137-155 -> StateExhaustedException). B4's plants sit on the
# tripwire pool instead, split so the halves cannot starve each other: AutoStateGroup.values()
# (AutoStateGroup.java:38-39,46) puts LOWER_TRIPWIRE and HIGHER_TRIPWIRE before generic TRIPWIRE.
# BetterEnd-local usage: cave_vines 50/50 (B5 48 + B4 2); lower_tripwire 42/63 (B1 1 + B2 20
# + B4 21); higher_tripwire 32/63 (B4 26 + B5 6); generic tripwire 12/126 (B5).

