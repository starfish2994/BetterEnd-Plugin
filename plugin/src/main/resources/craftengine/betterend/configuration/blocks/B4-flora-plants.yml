# ---------------------------------------------------------------------------
# NOT PORTED from B4 (recorded here by the cross-batch pass -- they were dropped
# silently before):
#   * neon_cactus         - NeonCactusPlantBlock is 54 blockstate variants (shape x facing x age).
#                           betterend:neon_cactus_block ships in B8 as a plain pillar; its 2x2
#                           crafting recipe was removed there because this ingredient does not exist.
#   * crystal_moss_cover  - MultifaceSpreadeableBlock, 6-face multiface. No multiface behavior in
#                           BukkitBlockBehaviors, and its blockstate json is 12 multipart cases.
#   * pearlberry_seed     - commented out in the mod itself, EndCropBlocks.java:159. Lang key only.
#   * amber_grass_path    - no java, no texture, no model, no blockstate. Dead lang key.
#   * nightshade_moss     - BYG-integration only (integration/byg/BYGBlocks.java); not registered
#                           in a vanilla install.
