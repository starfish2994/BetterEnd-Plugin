# B7-metals -- the 12 metal/resource BLOCKS. Items live in configuration/items/B7-metals.yml.
#
# Mod truth:
#   EndMetalBlocks.java:69-146 (AETERNIUM_BLOCK / CHARCOAL_BLOCK / ENDER_BLOCK / AMBER_BLOCK and the
#   TERMINITE / THALLASIUM MetalMaterials) and MetalMaterial.java:181-196 addCommonBlockDefinitions,
#   which gives every block of a metal family: METAL_BLOCK, instrument IRON_XYLOPHONE, strength(5,6),
#   requiresCorrectToolForDrops, SoundType.IRON, then the family's own mapColor/strength on top.
#     TERMINITE  makeOreless(hardness 7, resistance 9, mapColor WARPED_WART_BLOCK, NEEDS_IRON_TOOL)
#     THALLASIUM makeNormal(mapColor COLOR_BLUE, NEEDS_STONE_TOOL) -> keeps strength(5,6)
#   required_break_power follows the live pack's scale (basic_blocks.yml: obsidian = 3, i.e. diamond),
#   so NEEDS_STONE_TOOL=1, NEEDS_IRON_TOOL=2, NEEDS_DIAMOND_TOOL=3.
#
# State budget: 8 cubes x1 = 8 SOLID candidates. The 2 chains (3 each) and 2 bars (2 each) no
# longer touch a pool at all -- they pin explicit copper states, see below.
#
# SHAPE DONORS (2026 remap). Collision is NOT overridable in CraftEngine: BukkitBlockShape.java:20-26
# delegates getShape/getCollisionShape straight to the donor visual state bound at
# BukkitBlockManager.java:312, and none of the 37 keys in BlockSettingsModifiers.java is a shape or
# collision override. So a bar or a chain on `auto_state: solid` (note_block / mushroom blocks) was a
# FULL SOLID CUBE you could not walk past. Both now pin non-waxed copper states, which
# internal/mappings.yml:4171+,4302+ collapses onto their waxed twins, so the states are free and --
# being in no AutoStateGroup (AutoStateGroup.java:12-58) -- unreachable by any other pack's
# auto-allocation. Verified unclaimed across all 8 packs on the server.
#   *_chain  -> copper_chain[axis=..]   : vanilla chain, a 3x3 rod on the axis. Exact match.
#   *_bars   -> copper_bars[..]         : vanilla pane, 2px thick. The chosen CONNECTION pattern is
#                                         what gives the collision, so the north/south pair backs the
#                                         z run and the east/west pair backs the x run -- the hitbox
#                                         now follows the rendered run.
#
# STILL UNPORTABLE, recorded rather than faked:
#   terminite_bars / thallasium_bars still do not CONNECT to neighbours. CE has no pane/connection
#   behavior (BukkitBlockBehaviors.java lists fence_block but nothing 4-way-connecting for a thin
#   block), and one appearance takes exactly one model, not a multipart list -- the mod's blockstate
#   json is a 16-way multipart. They ship as a straight run on an `axis` property. Making them
#   connect would need one custom property plus one stolen state per connection combination.
#   Waterlogging is still not offered: the copper donors all carry `waterlogged`, but exposing it
#   would double the state cost and CE would need `settings.fluid_state: water` per variant.
#   ender_block's client-side tint (EnderBlock.java:20 getColor -> 0xFF005548) has no CE equivalent
#   for a solid block; the texture ships untinted.

