blocks:
  # EndMetalBlocks.java:112-124: strength(65, 1200), NEEDS_DIAMOND_TOOL, SoundType.NETHERITE_BLOCK,
  # MapColor.COLOR_GRAY. The mod also makes its BlockItem fire-resistant; that is the netherite
  # damage_resistant component and is recorded as debt rather than guessed at.
  betterend:aeternium_block:
    settings:
      template:
        - default:sound/block_template
        - default:settings/solid_1x1x1
      arguments:
        block_type: netherite_block
      merges:
        hardness: 65.0
        resistance: 1200.0
        instrument: iron_xylophone
        map_color: color_gray
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 3
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/aeternium_block

  # EndMetalBlocks.java:139-145: STONE_BLOCK trait + MapColor.COLOR_YELLOW, no explicit strength.
  # BlockTraits.STONE_BLOCK lives in wover, which is not in Reference/, so hardness/resistance use
  # vanilla stone's 1.5/6.0. UNVERIFIED -- re-check when the wover jar is available.
  betterend:amber_block:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.5
        resistance: 6.0
        instrument: basedrum
        map_color: color_yellow
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/amber_block

  # EndMetalBlocks.java:126-130: STONE_BLOCK trait only. Same wover caveat as amber_block.
  betterend:charcoal_block:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 1.5
        resistance: 6.0
        instrument: basedrum
        map_color: color_black
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/charcoal_block

  # EndMetalBlocks.java:132-137: strength(5, 6), SoundType.STONE, MapColor.WARPED_WART_BLOCK,
  # requiresCorrectToolForDrops with no tier tag -> any pickaxe (required_break_power stays 0).
  betterend:ender_block:
    settings:
      template:
        - default:sound/stone
        - default:settings/solid_1x1x1
      merges:
        hardness: 5.0
        resistance: 6.0
        instrument: basedrum
        map_color: warped_wart_block
        correct_tools: ['#minecraft:pickaxes']
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/ender_block

  betterend:terminite_block:
    settings:
      template:
        - default:sound/metal
        - default:settings/solid_1x1x1
      merges:
        hardness: 7.0
        resistance: 9.0
        instrument: iron_xylophone
        map_color: warped_wart_block
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 2
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/terminite_block

  betterend:terminite_tile:
    settings:
      template:
        - default:sound/metal
        - default:settings/solid_1x1x1
      merges:
        hardness: 7.0
        resistance: 9.0
        instrument: iron_xylophone
        map_color: warped_wart_block
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 2
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/terminite_tile

  # blockstates/terminite_chain.json: axis=x -> x:90 y:90, axis=y -> none, axis=z -> x:90.
  # default:block_state/pillar is a cube_column template and cannot express those rotations,
  # so the three variants are written out. x/y/uvlock are read at AbstractBlockManager.java:990-1021.
  betterend:terminite_chain:
    settings:
      template:
        - default:sound/metal
        - default:settings/transparent_1x1x1
      merges:
        hardness: 7.0
        resistance: 9.0
        instrument: iron_xylophone
        map_color: warped_wart_block
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 2
        push_reaction: destroy
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      properties:
        axis:
          type: axis
          default: y
      appearances:
        axisX:
          state: copper_chain[axis=x,waterlogged=false]
          model:
            path: betterend:block/terminite_chain
            x: 90
            y: 90
        axisY:
          state: copper_chain[axis=y,waterlogged=false]
          model: betterend:block/terminite_chain
        axisZ:
          state: copper_chain[axis=z,waterlogged=false]
          model:
            path: betterend:block/terminite_chain
            x: 90
      variants:
        axis=x:
          appearance: axisX
        axis=y:
          appearance: axisY
        axis=z:
          appearance: axisZ

  betterend:terminite_bars:
    settings:
      template:
        - default:sound/metal
        - default:settings/transparent_1x1x1
      merges:
        hardness: 7.0
        resistance: 9.0
        instrument: iron_xylophone
        map_color: warped_wart_block
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 2
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      properties:
        axis:
          type: axis
          default: z
      appearances:
        runZ:
          state: copper_bars[east=false,north=true,south=true,west=false,waterlogged=false]
          model: betterend:block/terminite_bars_run
        runX:
          state: copper_bars[east=true,north=false,south=false,west=true,waterlogged=false]
          model:
            path: betterend:block/terminite_bars_run
            y: 90
      variants:
        # No vertical bars exist. axis=y reuses the z run so the state table stays complete
        # without spending a third candidate.
        axis=x:
          appearance: runX
        axis=y:
          appearance: runZ
        axis=z:
          appearance: runZ

  betterend:thallasium_block:
    settings:
      template:
        - default:sound/metal
        - default:settings/solid_1x1x1
      merges:
        hardness: 5.0
        resistance: 6.0
        instrument: iron_xylophone
        map_color: color_blue
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/thallasium_block

  betterend:thallasium_tile:
    settings:
      template:
        - default:sound/metal
        - default:settings/solid_1x1x1
      merges:
        hardness: 5.0
        resistance: 6.0
        instrument: iron_xylophone
        map_color: color_blue
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      auto_state: solid
      texture: betterend:block/thallasium_tile

  betterend:thallasium_chain:
    settings:
      template:
        - default:sound/metal
        - default:settings/transparent_1x1x1
      merges:
        hardness: 5.0
        resistance: 6.0
        instrument: iron_xylophone
        map_color: color_blue
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        push_reaction: destroy
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      properties:
        axis:
          type: axis
          default: y
      appearances:
        axisX:
          state: exposed_copper_chain[axis=x,waterlogged=false]
          model:
            path: betterend:block/thallasium_chain
            x: 90
            y: 90
        axisY:
          state: exposed_copper_chain[axis=y,waterlogged=false]
          model: betterend:block/thallasium_chain
        axisZ:
          state: exposed_copper_chain[axis=z,waterlogged=false]
          model:
            path: betterend:block/thallasium_chain
            x: 90
      variants:
        axis=x:
          appearance: axisX
        axis=y:
          appearance: axisY
        axis=z:
          appearance: axisZ

  betterend:thallasium_bars:
    settings:
      template:
        - default:sound/metal
        - default:settings/transparent_1x1x1
      merges:
        hardness: 5.0
        resistance: 6.0
        instrument: iron_xylophone
        map_color: color_blue
        correct_tools: ['#minecraft:pickaxes']
        required_break_power: 1
        tags: [minecraft:mineable/pickaxe]
    loot:
      template: default:loot_table/self
    state:
      properties:
        axis:
          type: axis
          default: z
      appearances:
        runZ:
          state: exposed_copper_bars[east=false,north=true,south=true,west=false,waterlogged=false]
          model: betterend:block/thallasium_bars_run
        runX:
          state: exposed_copper_bars[east=true,north=false,south=false,west=true,waterlogged=false]
          model:
            path: betterend:block/thallasium_bars_run
            y: 90
      variants:
        axis=x:
          appearance: runX
        axis=y:
          appearance: runZ
        axis=z:
          appearance: runZ

