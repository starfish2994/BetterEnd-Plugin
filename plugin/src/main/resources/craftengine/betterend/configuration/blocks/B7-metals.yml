  betterend:aeternium_block:
    type: shaped
    category: building
    pattern: ['III', 'III', 'III']
    ingredients:
      I: betterend:aeternium_ingot
    result:
      id: betterend:aeternium_block
      count: 1
  betterend:aeternium_block_to_ingot:
    type: shapeless
    category: misc
    ingredients:
      - betterend:aeternium_block
    result:
      id: betterend:aeternium_ingot
      count: 9
  # amber_gem is a B5 id; this recipe only resolves once B5 ships.
  betterend:amber_block:
    type: shaped
    category: building
    pattern: ['##', '##']
    ingredients:
      '#': betterend:amber_gem
    result:
      id: betterend:amber_block
      count: 1
  betterend:charcoal_block:
